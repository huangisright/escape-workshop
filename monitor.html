<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密室監看</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="topbar">
    <span class="title" id="title">密室監看</span>
    <span class="badge" id="updated"></span>
  </div>

  <div class="wrap">
    <form id="login" class="panel hidden" style="max-width: 420px; margin: 10vh auto 0;">
      <h2>監看頁</h2>
      <label for="password" class="muted">監看密碼（在控制台試算表的「設定」分頁）</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <div class="feedback bad" id="login-msg" role="alert"></div>
      <button type="submit" class="primary" style="width: 100%;">進入</button>
    </form>

    <div id="board" class="panel hidden">
      <p class="muted" id="board-note" style="margin-top: 0;"></p>
      <div class="scroll-x">
        <table class="board">
          <thead>
            <tr>
              <th>組別</th><th>位置</th><th>剩餘時間</th><th>本題已花／建議</th>
              <th>提示</th><th>跳過</th><th>答錯</th><th>逃脫時間</th><th>寶庫</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="engine.js"></script>
  <script src="demo-content.js"></script>
  <script src="api.js"></script>
  <script src="monitor.js"></script>
</body>
</html>
