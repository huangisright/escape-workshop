<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黃金城密室</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <!-- 輸入組別 -->
  <section id="screen-join" class="wrap hidden">
    <div class="panel center" style="margin-top: 10vh;">
      <h1 id="join-title">黃金城密室</h1>
      <p class="muted" id="join-mode"></p>
      <form id="join-form" style="max-width: 360px; margin: 24px auto 0;">
        <label for="team-input" class="muted">組別代碼</label>
        <input type="text" id="team-input" autocomplete="off" autocapitalize="characters" required>
        <div class="feedback bad" id="join-msg" role="alert"></div>
        <button type="submit" class="primary" style="width: 100%; margin-top: 8px;">開始</button>
      </form>
    </div>
  </section>

  <!-- 遊戲中 -->
  <section id="screen-game" class="hidden">
    <div class="topbar">
      <span class="title" id="game-title"></span>
      <span class="badge" id="team-badge"></span>
      <span class="badge test hidden" id="test-badge">測試模式</span>
      <span class="timer" id="timer" aria-live="off">--:--</span>
    </div>

    <div class="wrap">
      <div class="progress" id="progress" aria-hidden="true"></div>

      <!-- 測試模式工具 -->
      <div id="test-tools" class="panel hidden" style="margin-bottom: 16px; padding: 14px 18px;">
        <div class="entry-row" style="margin: 0; align-items: center;">
          <strong>測試工具</strong>
          <button type="button" id="btn-reveal">看答案</button>
          <span id="jump-buttons" class="entry-row" style="margin: 0;"></span>
          <button type="button" id="btn-restart" class="ghost">從頭開始</button>
        </div>
        <div id="reveal-box" class="hint-box hidden"></div>
      </div>

      <div class="panel" id="stage"></div>

      <div class="panel" style="margin-top: 16px;">
        <div class="question-head">
          <h3 style="margin: 0;">線索簿</h3>
          <span class="muted" id="ledger-note"></span>
        </div>
        <div class="fragments" id="fragments" style="margin-top: 10px;"></div>
      </div>
    </div>
  </section>

  <!-- 對話框 -->
  <div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="panel">
      <h2 id="modal-title"></h2>
      <div class="story" id="modal-body"></div>
      <div class="actions" style="justify-content: center;" id="modal-actions"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="engine.js"></script>
  <script src="demo-content.js"></script>
  <script src="api.js"></script>
  <script src="play.js"></script>
</body>
</html>
