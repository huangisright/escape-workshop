<style>

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}

/* 列印 */
.printonly{display:none}
@media print{.top,.noprint,#toast{display:none!important}.printonly{display:block}body{background:#fff}.card{break-inside:avoid;border-color:#999}.wrap{max-width:none;padding:0}}

/* 等伺服器回應時的提示：按下去的按鈕轉圈、畫面頂端跑一條進度線 */
.busy{position:relative;opacity:.6;cursor:progress!important;pointer-events:none}
.busy::after{content:"";position:absolute;right:8px;top:50%;width:14px;height:14px;margin-top:-7px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
#netbar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:100;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:netbar 1s linear infinite}
#netbar.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes netbar{from{background-position:-40% 0}to{background-position:140% 0}}

<body>
<div id="app"></div>
<div id="toast"></div>
<div id="netbar"></div>
<div id="modal"></div>
<script>
/* ============================================================
   共用
   ============================================================ */
var S = {
  code: null, me: null, view: '', target: '', puzzle: null, room: null, ws: null, edit: {},
  fileCache: {}, admin: { tab: 'overview', data: null }, play: null, saver: null, timers: []
};
var app = document.getElementById('app');

function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
/* 背景動作（自動儲存、輪詢、讀圖）不顯示「處理中」，其餘的呼叫都讓使用者馬上看到有在動 */
var QUIET_FNS = { savePuzzle: 1, saveRoom: 1, playState: 1, adminLive: 1, getFileData: 1 };
var NET = { pending: 0, timer: null };
function netBusy(on) {
  var bar = document.getElementById('netbar');
  if (on) {
    if (NET.pending++ === 0) NET.timer = setTimeout(function () { if (bar) bar.className = 'on'; }, 150);
  } else if (--NET.pending <= 0) {
    NET.pending = 0; clearTimeout(NET.timer); if (bar) bar.className = '';
  }
}
function api(fn) {
  var args = arguments;
  if (QUIET_FNS[fn]) return apiRaw.apply(null, args);
  // 剛點下去的那顆按鈕（或那一列）：轉圈並暫停點擊，避免連按送出兩次
  var el = (S.click && Date.now() - S.click.at < 300 && document.contains(S.click.el)) ? S.click.el : null;
  if (el) { el.classList.add('busy'); S.click = null; }
  netBusy(true);
  var done = function () { netBusy(false); if (el) el.classList.remove('busy'); };
  return apiRaw.apply(null, args).then(function (r) { done(); return r; }, function (e) { done(); throw e; });
}
/** 網路問題（斷線、逾時、伺服器暫時回不來）：和「伺服器明確說不行」分開，斷線時不能把人踢回登入頁 */
function netErr(msg) { var e = new Error(msg); e.net = true; return e; }
function apiRaw(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (window.ER_API) { // 放在 GitHub Pages 時：直接呼叫 Apps Script 的 API，不帶 Google 登入資訊
    return fetch(window.ER_API, {
      method: 'POST', credentials: 'omit', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args })
    }).then(function (r) {
      if (!r.ok) throw netErr('連線失敗（' + r.status + '），請稍後再試');
      return r.json().catch(function () { throw netErr('連線不穩，請稍後再試'); });
    }, function () { throw netErr('連不上伺服器，請檢查網路後再試'); }).then(function (j) {
      if (!j || !j.ok) throw new Error((j && j.error) || '伺服器回應錯誤');
      return j.result;
    });
  }
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) {
      var err = e && e.message ? e : new Error(String(e));
      if (navigator.onLine === false) err.net = true;
      rej(err);
    });
    r[fn].apply(r, args);
  });
}
/** 給學生的網址（QR code 用）：在 GitHub Pages 上就用目前這一頁 */
function frontUrl(d) {
  if (window.ER_API) return location.origin + location.pathname;
  return (d && d.appUrl) || '';
}
function toast(msg, kind) {
  var t = document.createElement('div');
  t.textContent = msg;
  if (kind) t.className = kind;
  document.getElementById('toast').appendChild(t);
  setTimeout(function () { t.remove(); }, kind === 'err' ? 5000 : 2600);
}

/* 自動儲存 */
function makeSaver(getData, send, onSaved) {
  var timer = null, inflight = null, seq = 0, sentSeq = 0;
  var api_ = {
    touch: function () { seq++; setSaveStatus('editing'); clearTimeout(timer); timer = setTimeout(api_.flush, 1200); },
    // 一次只送一筆：還有一筆在路上時，等它回來再決定要不要送下一筆。
    // （以前兩個等待中的儲存會同時送出同一個版本，第二筆就被當成「別人改過」）
    flush: function () {
      clearTimeout(timer);
      if (inflight) return inflight.then(function () { return api_.flush(); });
      if (seq === sentSeq) return Promise.resolve();
      var my = seq;
      setSaveStatus('saving');
      inflight = send(clone(getData())).then(function (r) {
        sentSeq = my;
        api_.warned = false;
        onSaved(r);
        setSaveStatus(seq === sentSeq ? 'saved' : 'editing');
        if (seq !== sentSeq) timer = setTimeout(api_.flush, 800);
      }).catch(function (e) {
        setSaveStatus('error');
        if (/送審|權限|只能|太長/.test(e.message || '')) { sentSeq = seq; fail(e); }
        else { // 網路或同時太多人儲存：自動重試
          if (!api_.warned) { toast('儲存暫時失敗，系統會自動重試，請先不要關掉頁面', 'err'); api_.warned = true; }
          clearTimeout(timer); timer = setTimeout(api_.flush, 5000);

/* 玩家角度預覽（只在本機判斷答案，不會記錄） */
function previewPuzzle(p) {
  var gates = [];
  (p.steps || []).forEach(function (s) { if (String(s.checkpoint || '').trim()) gates.push({ label: s.result || '中途答案', answers: splitAns(s.checkpoint) }); });
  gates.push({ label: '答案', answers: splitAns(p.answer) });
  var g = 0;
  var d = modal('<div style="background:#12161b;color:#eef0f2;border-radius:12px;padding:6px 14px 14px;margin-top:22px"><div class="pcard" style="margin-top:12px"><h2>' + esc(p.title) + '</h2><div id="pvBlocks"></div></div>' +
    '<div class="pcard"><div class="gate" id="pvGate"></div><input class="pin" id="pvIn" autocomplete="off"><button class="pbtn" id="pvGo">送出</button><div class="pmsg" id="pvMsg"></div>' +
    (p.hints || []).filter(function (x) { return String(x.text || '').trim() || x.imageId; }).map(function (x, i) { return '<div class="phint">提示 ' + (i + 1) + '（開始後 ' + (x.delaySec || 0) + ' 秒）：' + esc(x.text) + (x.imageId ? '<img data-file="' + esc(x.imageId) + '" alt="提示圖片">' : '') + '</div>'; }).join('') + '</div></div>');
  var setGate = function () { d.querySelector('#pvGate').textContent = gates.length > 1 ? '第 ' + (g + 1) + ' / ' + gates.length + ' 步：' + gates[g].label : '答案'; };
  setGate();
  renderPlayBlocks(d.querySelector('#pvBlocks'), (p.blocks || []).map(function (b) { return b; }), true);
  d.querySelectorAll('.phint img[data-file]').forEach(function (el) { hydrateFiles(el.parentNode); });
  d.querySelector('#pvGo').onclick = function () {
    var v = d.querySelector('#pvIn').value, m = d.querySelector('#pvMsg');
    if (norm(v) && gates[g].answers.some(function (a) { return norm(a) === norm(v); })) {
      if (g < gates.length - 1) { g++; setGate(); m.className = 'pmsg good'; m.textContent = '正確！繼續下一步'; d.querySelector('#pvIn').value = ''; }
      else { m.className = 'pmsg good'; m.textContent = '答對了！這題完成'; }
    } else { m.className = 'pmsg bad'; m.textContent = '答案不對'; }
  };
}

function openRoomEditor() {

    if (!room.finale) room.finale = { enabled: false, text: '', imageId: '', answer: '', hint: '' };
    S.room = room;
    S.target = 'room';
    var editable = ws.mode === 'admin' || room.editable;
    S.edit = { editable: editable, mode: ws.mode };
    S.saver = editable ? makeSaver(function () { return S.room; }, function (d) { return api('saveRoom', S.code, d); }, function (r) {
      if (r.conflict) { toast('剛被別人改過，已載入最新版本', 'err'); S.room = r.room; renderRoomEditor(); return; }
      S.room.rev = r.room.rev;
      ws.room = clone(S.room);
      ws.roomChecks = r.roomChecks;
    }) : null;
    renderRoomEditor();
  };
  // 分組的工作區資料裡已經有完整的密室內容，直接打開，不必再等一次伺服器
  if (ws.mode === 'group' && ws.room && ws.room.cover) {
    var r = clone(ws.room); r.editable = ws.editable; go(r);
    // 背景再確認一次：如果同組有人剛改過、或老師剛鎖定，而這邊還沒開始打字，就換成最新版
    return apiRaw('getRoom', S.code, ws.room.id).then(function (fresh) {
      if (S.view !== 'room' || !S.room || S.room.id !== fresh.id) return;
      if ((fresh.rev || 0) === (S.room.rev || 0) && !!fresh.editable === !!S.edit.editable) return;
      if (S.saver && S.saver.pending()) return; // 已經在打字：交給儲存時的衝突處理
      go(fresh);
    }).catch(function () { });
  }
  api('getRoom', S.code, ws.room.id).then(go).catch(fail);
}

function certHtml(st) {
  var c = st.cert;
  if (!c) return '';
  var win = st.result === 'escaped';
  var n = c.puzzles.filter(function (p) { return p.sec !== null; }).length;
  var mmss = function (s) { s = Math.max(0, Math.round(s)); return ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + s % 60).slice(-2); };
  return '<div class="cert"><div class="fr"><img class="logo" alt="資優班班徽" src="' + CERT_LOGO + '">' +
    '<div class="stamp ' + (win ? 'win' : 'lose') + '"><small>★ ESCAPE ★</small><b>' + (win ? 'SUCCESS' : 'FAILED') + '</b><small>' + (win ? mmss(st.elapsedSec) : 'TIME UP') + '</small></div>' +
    '<p class="room">' + esc(c.room) + '</p><h1>' + (win ? '逃脫證書' : '挑戰證書') + '</h1>' +
    '<span class="seal ' + (win ? 'win' : 'lose') + '">' + (win ? '★ 成功逃脫' : '勇敢挑戰到最後一刻') + '</span>' +
    '<p class="team">茲證明<b>' + esc(c.team) + '</b></p>' +
    (c.members.length ? '<p class="members"><small class="l">闖關成員</small>' + c.members.map(esc).join('、') + '</p>' : '') +
    '<p class="lead">' + (win ? (n === c.puzzles.length ? '運用推理與合作，解開全部關卡，成功逃出密室。' : '運用推理與合作，成功逃出密室。') : '在時限內奮戰到最後，解開了 ' + n + ' 道關卡。') + '</p>' +
    '<div class="stats"><div><small>' + (win ? '逃脫時間' : '挑戰時間') + '</small><span>' + mmss(st.elapsedSec) + '</span></div>' +
    '<div><small>解開關卡</small><span>' + n + ' / ' + c.puzzles.length + '</span></div>' +
    '<div><small>日期</small><span style="font-size:14px">' + esc(c.date) + '</span></div></div>' +
    '<h3>— 關卡與設計者 —</h3><table><tr class="hd"><td class="no">關卡</td><td>名稱</td><td class="st">過關用時</td><td class="who">設計者</td></tr>' +
    c.puzzles.map(function (p, i) {
      var ok = p.sec !== null;
      return '<tr><td class="no">第 ' + (i + 1) + ' 關</td><td>' + esc(p.title) + '</td><td class="st ' + (ok ? 'ok' : 'no2') + '">' + (ok ? '✓ ' + mmss(p.sec) : '未解開') + '</td><td class="who">' + (p.author ? '<small class="l">設計者</small>' + esc(p.author) : '') + '</td></tr>';
    }).join('') + '</table><div class="foot">密室工坊・闖關紀錄自動產生</div></div></div>';
}
function finishRate() {
  var P = S.play;
  var list = Object.keys(P.rate).map(function (k) { return { id: k, rating: P.rate[k] }; });
  api('playRate', P.id, list, document.getElementById('liked').value, document.getElementById('stuck').value).then(function () {
    app.innerHTML = '<div class="play"><div class="pcard center"><h2>謝謝你的回饋！</h2>' +
      (P.test && S.code ? '<button class="pbtn" data-act="backFromTest">回到編輯</button>' : '<button class="pbtn ghost" data-act="toLogin">回到首頁</button>') + '</div></div>';
  }).catch(fail);
}

app.addEventListener('input', function (e) {
  var t = e.target, f = t.getAttribute('data-f');
  if (t.hasAttribute('data-asmplace') && S.assemble) { S.assemble.places[t.getAttribute('data-asmplace')] = t.value; return; }
  if (t.hasAttribute('data-plid') && S.placesEdit) { S.placesEdit.places[t.getAttribute('data-plid')] = t.value; return; }
  if (t.hasAttribute('data-asmfrag') && S.assemble) {
    S.assemble.frags[Number(t.getAttribute('data-asmfrag'))] = t.value;
    var j = document.getElementById('asmJoined');
    if (j) j.textContent = S.assemble.frags.join('');
    return;
  }
  if (!f || !S.saver) return;
  var obj = S.target === 'room' ? S.room : S.puzzle;
  var v = t.value;
  if (t.getAttribute('data-num')) v = v === '' ? '' : Number(v);
  setPath(obj, f, v);
  S.saver.touch();
});
app.addEventListener('change', function (e) {
  var t = e.target;
  if (t.getAttribute('data-check') && S.saver) {
    setPath(S.target === 'room' ? S.room : S.puzzle, t.getAttribute('data-check'), t.checked);
    S.saver.touch();
    if (S.target === 'room') renderRoomEditor();
    return;
  }
  if (t.tagName === 'SELECT' && t.getAttribute('data-f') && S.saver) {
    setPath(S.target === 'room' ? S.room : S.puzzle, t.getAttribute('data-f'), t.value);
    S.saver.touch();
    if (S.target === 'room' && t.getAttribute('data-f') === 'mode') renderRoomEditor();
    return;
  }
  var up = t.getAttribute('data-upload');
  if (!up || !t.files || !t.files[0]) return;
  var file = t.files[0];
  if (up === 'block' || up === 'html') {
    var i = Number(t.getAttribute('data-i')), b = S.puzzle.blocks[i];
    var meta = { roomId: S.puzzle.roomId, puzzleId: S.puzzle.id, label: BLOCK_TYPES[b.type] };
    var job = up === 'html'
      ? prepareHtml(file).then(function (html) {
          if (html === null) return null;
          toast('上傳中…');
          return api('uploadFile', S.code, { roomId: S.puzzle.roomId, puzzleId: S.puzzle.id, label: 'HTML', name: file.name, mime: 'text/html' }, html, true)
            .then(function (r) { S.fileCache[r.fileId] = { mime: 'text/html', text: html }; r.fileName = file.name; return r; });
        })
      : uploadMedia(file, b.type, meta);
    job.then(function (r) {
      if (!r) return;
      b.fileId = r.fileId;
      if (r.fileName) b.fileName = r.fileName;
      toast('上傳完成');
      S.saver.touch();
      renderPuzzleEditor();
    }).catch(fail);
  }
  if (up === 'hintimg') {
    var hi = Number(t.getAttribute('data-i')), hp = S.puzzle;
    uploadMedia(file, 'image', { roomId: hp.roomId, puzzleId: hp.id, label: '提示圖片' }).then(function (r) {
      if (!hp.hints[hi]) return;
      hp.hints[hi].imageId = r.fileId;
      toast('上傳完成');
      S.saver.touch();
      renderPuzzleEditor();
    }).catch(fail);
  }
  if (up === 'roomimg' || up === 'mindmap') {
    var path = up === 'mindmap' ? 'mindmap.fileId' : t.getAttribute('data-path');
    uploadMedia(file, /pdf/.test(file.type) ? 'file' : 'image', { roomId: S.room.id, label: up === 'mindmap' ? '心智圖' : t.getAttribute('data-label') }).then(function (r) {
      setPath(S.room, path, r.fileId);
      toast('上傳完成');
      S.saver.touch();
      renderRoomEditor();
    }).catch(fail);
  }
});
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled || el.classList.contains('busy')) return;
  S.click = { el: el, at: Date.now() };
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  if (el.tagName === 'A') e.preventDefault();
  var A = ACTIONS[act];
  if (A) A(el, id);
});
var ACTIONS = {
  closeModal: function () { closeModal(); },
  login: function () { var c = document.getElementById('code').value.trim(); if (!c) return toast('請輸入代碼', 'err'); doLogin(c); },
  toPlay: function () { var c = document.getElementById('pcode').value.trim().toUpperCase(); if (!c) return toast('請輸入遊戲代碼', 'err'); showPlayEntry(c); },
  toLogin: function () { S.play = null; store('erPlay', null); S.me ? (S.me.role === 'admin' ? showAdmin() : S.me.role === 'teacher' ? showTeacherHome() : showGroupHome()) : showLogin(); },
  logout: function () { leaveEditor().then(function () { store('erCode', null); S.me = null; S.code = null; showLogin(); }); },
  editRoom: function () { openRoomEditor(); },
  backRoom: function () { backFromRoom(); },
  backPuzzle: function () { backFromPuzzle(); },
  openPuzzle: function (el, id) {
    var mine = S.ws.mode === 'teacher' && (S.ws.puzzles || []).some(function (x) { return x.id === id && x.editable; });
    // 老師自己的題目清單裡就有完整內容，直接開；別人的題目才向伺服器拿最新版
    if (S.ws.mode === 'teacher' && !mine) return api('getPuzzle', S.code, id).then(function (p) { var i = S.ws.puzzles.map(function (x) { return x.id; }).indexOf(id); S.ws.puzzles[i] = p; openPuzzle(id); }).catch(fail); openPuzzle(id); },
  newPuzzle: function () { api('newPuzzle', S.code).then(function (p) { p.editable = true; S.ws.puzzles.push(p); openPuzzle(p.id); }).catch(fail); },
  movePuzzle: function (el, id) {
    var dir = Number(el.getAttribute('data-dir')), ps = S.ws.puzzles;
    var i = ps.map(function (x) { return x.id; }).indexOf(id), j = i + (dir < 0 ? -1 : 1);
    if (i < 0 || j < 0 || j >= ps.length) return;
    var t = ps[i]; ps[i] = ps[j]; ps[j] = t; // 先在畫面上換好，伺服器在背景存
    renderWorkspace();
    apiRaw('movePuzzle', S.code, id, dir).catch(function (e) { fail(e); showGroupHome(); });
  },
  deletePuzzle: function () {
    confirmBox('確定要刪除「' + (S.puzzle.title || '這一題') + '」嗎？刪除後無法復原。', '刪除').then(function (ok) {
      if (!ok) return;
      S.saver = null;
      api('deletePuzzle', S.code, S.puzzle.id).then(function () { toast('已刪除'); S.ws.mode === 'teacher' ? showTeacherHome() : showGroupHome(); }).catch(fail);
    });
  },
  setKind: function (el) { S.puzzle.kind = el.getAttribute('data-k'); S.saver.touch(); app.querySelectorAll('[data-act=setKind]').forEach(function (b) { b.className = b === el ? 'on' : ''; }); },
  addRow: function (el) {
    var arr = el.getAttribute('data-arr'), p = S.puzzle;
    p[arr] = p[arr] || [];
    if (arr === 'steps') p.steps.push({ get: '', act: '', result: '', checkpoint: '' });
    if (arr === 'hints') p.hints.push({ text: '', delaySec: (S.me.settings.defaultHintDelaySec || 60) * (p.hints.length + 1) });
    if (arr === 'props') p.props.push({ item: '', place: '' });
    S.saver.touch(); renderPuzzleEditor();
  },
  delRow: function (el) {
    var arr = el.getAttribute('data-arr'), i = Number(el.getAttribute('data-i'));
    S.puzzle[arr].splice(i, 1); S.saver.touch(); renderPuzzleEditor();
  },
  addBlock: function (el) {
    var t = el.getAttribute('data-t'), b = { type: t };
    if (t === 'text') b.text = '';
    if (t === 'html') b.height = 520;
    if (t === 'link') { b.url = ''; b.label = ''; }
    S.puzzle.blocks = S.puzzle.blocks || [];
    S.puzzle.blocks.push(b); S.saver.touch(); renderPuzzleEditor();
  },
  moveBlock: function (el) {
    var i = Number(el.getAttribute('data-i')), j = i + Number(el.getAttribute('data-dir')), bl = S.puzzle.blocks;
    if (j < 0 || j >= bl.length) return;
    var t = bl[i]; bl[i] = bl[j]; bl[j] = t; S.saver.touch(); renderPuzzleEditor();
  },
  previewHtml: function (el) {
    var b = S.puzzle.blocks[Number(el.getAttribute('data-i'))];
    fileData(b.fileId).then(function (d) {
      var dlg = modal('<h3>預覽</h3><iframe sandbox="allow-scripts allow-popups allow-forms" style="width:100%;height:' + (Number(b.height) || 520) + 'px;border:1px solid #ccc;border-radius:8px"></iframe>');
      dlg.querySelector('iframe').srcdoc = d.text || '';
    }).catch(fail);
  },
  previewPuzzle: function () { previewPuzzle(S.puzzle); },
  previewById: function (el, id) { previewPuzzle(S.viewPuzzles.filter(function (p) { return p.id === id; })[0]); },
  addStory: function () { S.room.story = S.room.story || []; S.room.story.push({ text: '', imageId: '' }); S.saver.touch(); renderRoomEditor(); },
  delStory: function (el) { S.room.story.splice(Number(el.getAttribute('data-i')), 1); S.saver.touch(); renderRoomEditor(); },
  clearHintImg: function (el) { var x = S.puzzle.hints[Number(el.getAttribute('data-i'))]; if (x) x.imageId = ''; S.saver.touch(); renderPuzzleEditor(); },
  clearImg: function (el) { setPath(S.room, el.getAttribute('data-path'), ''); S.saver.touch(); renderRoomEditor(); },
  testPlay: function () {
    var go = function () { api('startTestPlay', S.code, S.ws.room.id).then(function (intro) { S.testReturn = S.ws.mode === 'admin' ? S.ws.room.id : 'group'; enterPlay(intro); }).catch(fail); };
    go();
  },
  backFromTest: function () {
    S.play = null;
    if (S.me.role === 'admin') return S.testReturn && S.testReturn !== 'group' && S.testReturn !== 'admin' ? adminOpenWorkspace(S.testReturn) : showAdmin();
    showGroupHome();
  },
  submitRoom: function () {
    confirmBox('送審後內容會鎖定，要修改得請老師開放（只能開放一次）。確定送審嗎？', '送審').then(function (ok) {
      if (!ok) return;
      api('submitRoom', S.code).then(function (r) {
        if (!r.ok) { S.ws.roomChecks = r.roomChecks; renderWorkspace(); toast('還有紅燈沒處理完', 'err'); return; }
        toast('已送審');
        showGroupHome();
      }).catch(fail);
    });
  },
  // 玩家
  playStart: function (el) {
    var team = document.getElementById('team').value.trim();
    if (!team) { document.getElementById('pmsg').textContent = '請先輸入隊名'; return; }
    var members = [].map.call(document.querySelectorAll('#mem input'), function (x) { return x.value.trim(); }).filter(function (x) { return x; });
    if (!members.length) { document.getElementById('pmsg').textContent = '請至少輸入一位闖關成員的名字'; return; }
    el.disabled = true;
    api('playStart', el.getAttribute('data-code'), team, members).then(function (intro) { S.playCode = el.getAttribute('data-code'); enterPlay(intro); }).catch(function (e) { el.disabled = false; document.getElementById('pmsg').textContent = e.message; });
  },
  addMember: function () {
    var box = document.getElementById('mem');
    if (box.children.length >= 12) return;
    var i = document.createElement('input');
    i.className = 'pin'; i.placeholder = '成員名字'; i.maxLength = 20; i.autocomplete = 'off';
    box.appendChild(i); i.focus();
  },
  introNext: function () { S.play.page++; showIntroPage(); },
  answer: function () { sendAnswer(); },
  hint: function () { askHint(); },
  skip: function () { askSkip(); },
  finishVault: function () { finishVault(); },
  openQ: function (el) { openQ(Number(el.getAttribute('data-i'))); },
  toggleMap: function () { S.play.mapHidden = !S.play.mapHidden; renderPlay(); },
  setTheme: function (el) { S.room.theme = el.getAttribute('data-t'); S.saver.touch(); renderRoomEditor(); },
  star: function (el) {
    var pid = el.getAttribute('data-pid'), v = Number(el.getAttribute('data-v'));
    S.play.rate[pid] = v;
    el.parentNode.querySelectorAll('button').forEach(function (b) { b.className = Number(b.getAttribute('data-v')) <= v ? 'on' : ''; });
  },
  sendRate: function () { finishRate(); },
  // 管理者
  toAdmin: function () { leaveEditor().then(function () { showAdmin(S.admin.tab); }); },
  toAdminBank: function () { showAdmin('bank'); },
  toAdminCodes: function () { showAdmin('codes'); },
  adminTab: function (el) { S.admin.tab = el.getAttribute('data-tab'); renderAdmin(); },
  refreshAdmin: function () { showAdmin(S.admin.tab); },
  adminView: function (el, id) { adminView(id); },
  adminEdit: function (el, id) {
    var r = S.admin.data.rooms.filter(function (x) { return x.id === id; })[0];
    if (r.kind === 'teacher') return ACTIONS.trEdit(el, id);
    adminOpenWorkspace(id);
  },
  trEdit: function (el, id) {
    S.ws = { room: { id: id }, mode: 'admin', puzzles: [], members: [], returnTo: 'bank' };
    openRoomEditor();
  },
  roomAction: function (el, id) {
    var a = el.getAttribute('data-a');
    var msg = { approve: '確定審核通過？', unlock: '開放這組修改？（會記錄開放次數）', publish: '發布（或更新）這個密室？會凍結目前的內容成為遊玩版本。', unpublish: '下架後玩家就不能再用遊戲代碼進入。確定下架？' }[a];
    confirmBox(msg).then(function (ok) {
      if (!ok) return;
      api('adminRoomAction', S.code, id, a).then(function (r) {
        toast('完成');
        showAdmin(S.admin.tab).then(function () { if (a === 'publish') ACTIONS.playQr(null, id); });
      }).catch(fail);
    });
  },
  playQr: function (el, id) {
    var r = S.admin.data.rooms.filter(function (x) { return x.id === id; })[0];
    var url = frontUrl(S.admin.data) ? frontUrl(S.admin.data) + '?p=' + r.playCode : '';
    modal('<h3>' + esc(r.title) + '</h3><p>遊戲代碼</p><div class="big">' + esc(r.playCode) + '</div><div class="qr" data-qr="' + esc(url) + '" style="margin:10px 0"></div><p class="muted" style="word-break:break-all">' + esc(url) + '</p>');
    document.querySelectorAll('#modal [data-qr]').forEach(function (q) { if (url) { try { new QRCode(q, { text: url, width: 200, height: 200 }); } catch (e) { } } });
  },
  adminTest: function (el, id) { api('startTestPlay', S.code, id).then(function (intro) { S.testReturn = 'admin'; enterPlay(intro); }).catch(fail); },
  adminStats: function (el, id) { adminStats(id); },
  adminExport: function (el, id) {
    var d = modal('<h3>匯出 HTML</h3><p class="help">檔案會存到雲端硬碟「密室工坊／匯出」資料夾。整間密室版可以在網路不穩時用筆電瀏覽器離線遊玩（答案已加密）。</p><div class="btns"><button class="btn" id="exRoom">整間密室一個檔</button><button class="btn ghost" id="exEach">一題一個檔</button></div><div id="exOut"></div>');
    var run = function (mode) {
      d.querySelector('#exOut').innerHTML = '<p class="muted">匯出中，題目多時需要一點時間…</p>';
      api('adminExport', S.code, id, mode).then(function (r) {
        d.querySelector('#exOut').innerHTML = '<p><a target="_blank" href="' + esc(r.folderUrl) + '">開啟匯出資料夾</a></p><ul>' + r.files.map(function (f) { return '<li><a target="_blank" href="' + esc(f.url) + '">' + esc(f.name) + '</a></li>'; }).join('') + '</ul>';
      }).catch(function (e) { d.querySelector('#exOut').innerHTML = ''; fail(e); });
    };
    d.querySelector('#exRoom').onclick = function () { run('room'); };
    d.querySelector('#exEach').onclick = function () { run('puzzles'); };
  },
  materials: function () { showMaterials(); },
  print: function () { window.print(); },
  bankOpen: function (el, id) {
    api('adminGetPuzzle', S.code, id).then(function (p) { S.ws = { mode: 'admin', puzzles: [p], room: { id: 'BANK' }, members: [], returnTo: 'bank' }; openPuzzle(id); }).catch(fail);
  },
  deleteTR: function (el, id) {
    var r = S.admin.data.rooms.filter(function (x) { return x.id === id; })[0];
    var msg = '確定要刪除示範密室「' + (r ? r.title : '') + '」嗎？' + (r && r.published ? '\n它目前已發布，刪除後遊戲代碼 ' + r.playCode + ' 會失效。' : '') +
      '\n題庫裡的題目不會被刪除，可以再組成別的密室。';
    confirmBox(msg, '刪除').then(function (ok) {
      if (!ok) return;
      api('adminDeleteRoom', S.code, id).then(function () { toast('已刪除'); showAdmin(S.admin.tab); }).catch(fail);
    });
  },
  createTR: function () {
    var n = document.getElementById('trName').value.trim();
    if (!n) return toast('請輸入名稱', 'err');
    api('adminCreateTeacherRoom', S.code, n).then(function () { showAdmin('bank'); }).catch(fail);
  },
  assemble: function (el, id) { showAssemble(id); },
  placesEdit: function (el, id) { showPlacesEdit(id); },
  placesSave: function () {
    var E = S.placesEdit;
    api('adminSetRoomPlaces', S.code, E.roomId, E.places).then(function () { toast('已儲存'); S.placesEdit = null; showAdmin('overview'); }).catch(fail);
  },
  showPlaces: function () { showPlacesTable(); },
  asmAdd: function (el, id) { S.assemble.ids.push(id); S.assemble.frags.push(''); renderAssemble(); },
  asmDel: function (el) { var i = Number(el.getAttribute('data-i')); S.assemble.ids.splice(i, 1); S.assemble.frags.splice(i, 1); renderAssemble(); },
  // 碎片跟著位置走，所以排序時只動題目、不動碎片
  asmMove: function (el) { var a = S.assemble.ids, i = Number(el.getAttribute('data-i')), j = i + Number(el.getAttribute('data-dir')); if (j < 0 || j >= a.length) return; var t = a[i]; a[i] = a[j]; a[j] = t; renderAssemble(); },
  asmVault: function (el, id) { S.assemble.vault.push(id); renderAssemble(); },
  asmVaultDel: function (el) { S.assemble.vault.splice(Number(el.getAttribute('data-i')), 1); renderAssemble(); },
  asmVaultMove: function (el) { var a = S.assemble.vault, i = Number(el.getAttribute('data-i')), j = i + Number(el.getAttribute('data-dir')); if (j < 0 || j >= a.length) return; var t = a[i]; a[i] = a[j]; a[j] = t; renderAssemble(); },
  asmSave: function () { var A = S.assemble; api('adminSetRoomPuzzles', S.code, A.roomId, A.ids, { fragments: A.frags, vaultIds: A.vault, places: A.places }).then(function () { toast('已儲存'); showAdmin('bank'); }).catch(fail); },
  saveCode: function (el) {
    var c = el.getAttribute('data-code');
    var nm = document.querySelector('[data-codename="' + c + '"]'), mm = document.querySelector('[data-codemem="' + c + '"]');
    var data = { name: nm ? nm.value : undefined };
    if (mm) data.members = mm.value;
    api('adminUpdateCode', S.code, c, data).then(function () { toast('已儲存'); showAdmin('codes'); }).catch(fail);
  },
  groupCheckAll: function (el) {
    document.querySelectorAll('[data-groupcheck]').forEach(function (x) { x.checked = el.checked; });
    ACTIONS.groupCheck();
  },
  groupCheck: function () {
    var all = document.querySelectorAll('[data-groupcheck]'), on = document.querySelectorAll('[data-groupcheck]:checked');
    var btn = document.getElementById('delGroupsBtn');
    if (btn) { btn.disabled = !on.length; btn.textContent = on.length ? '刪除勾選的 ' + on.length + ' 組' : '刪除勾選的組'; }
    var head = document.querySelector('[data-act="groupCheckAll"]');
    if (head) { head.checked = all.length > 0 && on.length === all.length; head.indeterminate = on.length > 0 && on.length < all.length; }
  },
  deleteGroups: function () {
    var codes = Array.prototype.map.call(document.querySelectorAll('[data-groupcheck]:checked'), function (x) { return x.getAttribute('data-groupcheck'); });
    if (!codes.length) return toast('請先勾選要刪除的組', 'err');
    var names = codes.map(function (c) { var g = S.admin.data.codes.filter(function (x) { return x.code === c; })[0]; return (g ? g.name : '') + '（' + c + '）'; });
    confirmBox('確定要刪除這 ' + codes.length + ' 組嗎？\n' + names.join('\n') + '\n刪除後這些代碼就不能登入了；已經有謎題卡的組會自動略過。', '刪除').then(function (ok) {
      if (!ok) return;
      api('adminDeleteGroups', S.code, codes).then(function (r) {
        if (r.skipped.length) toast('已刪除 ' + r.deleted.length + ' 組；略過 ' + r.skipped.length + ' 組：' + r.skipped.map(function (x) { return x.reason; }).join('；'), r.deleted.length ? '' : 'err');
        else toast('已刪除 ' + r.deleted.length + ' 組');
        showAdmin('codes');
      }).catch(fail);
    });
  },
  deleteGroup: function (el) {
    var c = el.getAttribute('data-code');
    var g = S.admin.data.codes.filter(function (x) { return x.code === c; })[0];
    confirmBox('確定要刪除分組「' + (g ? g.name : '') + '」（代碼 ' + c + '）嗎？\n刪除後這個代碼就不能登入了。', '刪除').then(function (ok) {
      if (!ok) return;
      api('adminDeleteGroup', S.code, c).then(function () { toast('已刪除'); showAdmin('codes'); }).catch(fail);
    });
  },
  createGroups: function () {
    var lines = document.getElementById('newGroups').value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    var list = lines.map(function (l) { var m = l.split(/[:：]/); return { name: m[0].trim(), members: (m[1] || '').trim() }; });
    if (!list.length) return toast('請先輸入分組', 'err');
    api('adminCreateGroups', S.code, list).then(function (r) { toast('已建立 ' + r.length + ' 組'); showAdmin('codes'); }).catch(fail);
  },
  createTeachers: function () {
    var names = document.getElementById('newTeachers').value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    if (!names.length) return toast('請先輸入姓名', 'err');
    api('adminCreateTeachers', S.code, names).then(function (r) { toast('已建立 ' + r.length + ' 位'); showAdmin('codes'); }).catch(fail);
  },
  printCodes: function () { printCodes(); },
  saveSettings: function () {
    var data = {};
    document.querySelectorAll('[data-set]').forEach(function (i) { data[i.getAttribute('data-set')] = i.type === 'checkbox' ? i.checked : i.value; });
    api('adminSaveSettings', S.code, data).then(function (s) { S.me.settings = s; S.admin.data.settings = s; toast('已儲存設定'); }).catch(fail);
  }
};
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'code') ACTIONS.login();
  if (e.key === 'Enter' && e.target.id === 'pcode') ACTIONS.toPlay();
  // 地圖上的島／拼圖／星球是 SVG，要自己處理鍵盤操作
  var t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button' && t.getAttribute('data-act') && t.tagName.toLowerCase() === 'g') {
    e.preventDefault();
    var A = ACTIONS[t.getAttribute('data-act')];
    if (A) A(t, t.getAttribute('data-id'));
  }
});
boot();
</script>
</body>
</html>
