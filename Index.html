<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<title>密室工坊</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#22252a;--muted:#6b6f76;--line:#e2ddd2;--acc:#1f6f6b;--acc2:#e7f2f1;--err:#c0392b;--errbg:#fdecea;--warn:#b7791f;--warnbg:#fdf4e3;--ok:#2f855a;--okbg:#e9f6ee;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit}
.top{position:sticky;top:0;z-index:20;background:#22252a;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.top .brand{font-weight:700;letter-spacing:.05em}
.top .who{opacity:.8;font-size:14px}
.top .sp{flex:1}
.top button{background:transparent;color:#fff;border:1px solid #fff5;border-radius:8px;padding:6px 12px;cursor:pointer}
.status{font-size:13px;opacity:.85}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 14px}
.card h3{margin:0 0 10px;font-size:18px}
.card h3 .no{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;text-align:center;line-height:26px;font-size:14px;margin-right:6px}
.help{color:var(--muted);font-size:14px;margin:0 0 10px}
label.f{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=password],input[type=number],input[type=url],textarea,select{width:100%;padding:10px 12px;border:1px solid #cfc9bd;border-radius:10px;background:#fff;color:var(--ink)}
input:disabled,textarea:disabled,select:disabled{background:#f3f1ec;color:#555}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:140px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.ghost{background:#fff;color:var(--acc)}
.btn.sm{padding:6px 10px;font-size:14px;font-weight:500}
.btn.danger{background:#fff;color:var(--err);border-color:var(--err)}
.btn.warn{background:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--acc);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--acc);padding:9px 18px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.chip{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:#eee;color:#444;white-space:nowrap}
.chip.draft{background:#eef1f5;color:#3b4a5e}.chip.submitted{background:var(--warnbg);color:var(--warn)}.chip.approved{background:var(--okbg);color:var(--ok)}
.chip.pub{background:var(--acc2);color:var(--acc)}
.dots{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.err{background:var(--err)}.dot.warn{background:#e0a72e}.dot.ok{background:var(--ok)}
.pb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pb{display:flex;flex-direction:column;justify-content:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.pb:hover,.pb:focus-visible{border-color:var(--acc);outline:none;box-shadow:0 0 0 2px var(--acc2)}
.pb-hd{display:flex;align-items:center;gap:8px}
.pb-hd .n{font-weight:700;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-hd .pct{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.pb-bar{height:10px;border-radius:99px;background:#ece8df;overflow:hidden;margin:8px 0 10px}
.pb-bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.pb-bar.full i{background:var(--ok)}
.pb-info{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.pb-info span{font-size:12px;padding:1px 7px;border-radius:99px;background:#f1eee8;color:#9a958b;text-decoration:line-through}
.pb-info span.ok{background:var(--okbg);color:var(--ok);text-decoration:none}
.pb-m{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0;border-top:1px dashed var(--line)}
.pb-m .who{width:5.5em;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-m .none{color:var(--err);font-size:13px}
.pb-q{display:inline-flex;flex-wrap:wrap;gap:4px}
.pb-q b{width:22px;height:22px;border-radius:6px;border:2px solid var(--err);display:inline-block;position:relative;overflow:hidden;background:#fff}
.pb-q b i{position:absolute;left:0;right:0;bottom:0;background:#eea39a}
.pb-q b.warn{border-color:#e0a72e}.pb-q b.warn i{background:#f6d58c}
.pb-q b.ok{border-color:var(--ok)}.pb-q b.ok i{background:var(--ok)}
.pb-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);align-items:center;margin-top:8px}
.pb-legend .pb-q b{width:16px;height:16px}
.checks{list-style:none;padding:0;margin:0}
.checks li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:15px}
.checks li .dot{margin-top:7px;flex:none}
.checks li.err{color:var(--err)}.checks li.warn{color:#8a5a12}.checks li.ok{color:var(--ok)}
.checks li.info{color:var(--muted)}.dot.info{background:#9aa3ad}
.an-flag{border-top:1px solid var(--line);padding:10px 0 2px}
.an-steps{padding-left:20px;margin:6px 0}.an-steps li{margin:4px 0}
.an-p{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.an-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.an-head .chip{margin-left:auto}
.an-sec{margin-top:6px;font-size:15px}.an-sec ul{margin:2px 0 0;padding-left:20px}
.an-note{margin-top:8px;background:var(--acc2);border-radius:8px;padding:8px 12px;font-size:15px}
.chip.v-fix{background:var(--errbg);color:var(--err)}.chip.v-adjust{background:var(--warnbg);color:var(--warn)}.chip.v-good{background:var(--okbg);color:var(--ok)}
.sub{border:1px dashed var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#fcfbf8}
.sub .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:600}
.sub .hd .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;cursor:pointer;font-size:14px}
.thumb{max-width:260px;max-height:180px;border-radius:8px;border:1px solid var(--line);display:block;margin:6px 0;background:#eee;min-height:40px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600}
.item .m{font-size:14px;color:var(--muted)}
.item.click{cursor:pointer}
.item.click:hover{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.banner{border-radius:12px;padding:12px 16px;margin-bottom:14px;background:var(--warnbg);color:#7a4f0f;border:1px solid #f1d9a8}
.banner.ok{background:var(--okbg);color:var(--ok);border-color:#bfe3cc}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-size:16px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
.center{text-align:center}
.big{font-size:28px;font-weight:700;letter-spacing:.1em}
.login{max-width:440px;margin:8vh auto;padding:0 16px}
.login h1{font-size:30px;margin:0 0 6px}
.login .card{padding:22px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1px solid #dadce0;background:#fff;color:#3c4043;border-radius:10px;padding:12px 16px;font-size:17px;font-weight:600;cursor:pointer}
.gbtn:hover{background:#f8f9fa}
.gbtn svg{width:20px;height:20px;flex:none}
.login .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:14px 0 10px}
.login .or:before,.login .or:after{content:"";flex:1;border-top:1px solid var(--line)}
.me-card{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.me-card .pc{font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:1px;background:var(--acc2);color:var(--acc);border-radius:8px;padding:2px 10px}
.chip.lead{background:#fff4d6;color:#8a5a00}
.chip.mine{background:var(--acc2);color:var(--acc)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.board .col{background:#fcfbf8;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.board .col.none{background:#fff8ec;border-style:dashed}
.board .col h4{margin:0 0 8px;font-size:16px;display:flex;gap:6px;align-items:center}
.board .st{display:flex;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.board .st:first-of-type{border-top:0}
.board .st .nm{flex:1;min-width:0}
.board .st .nm small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .st select{width:auto;max-width:110px;padding:4px 6px;font-size:13px}
.board .st .star{border:0;background:none;cursor:pointer;font-size:18px;line-height:1;padding:2px;color:#c9c3b6}
.board .st .star.on{color:#e0a100}
.joinbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.joinbox .jc{font-family:ui-monospace,Menlo,monospace;font-size:40px;font-weight:700;letter-spacing:6px;color:var(--acc)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:#22252a;color:#fff;padding:10px 18px;border-radius:10px;max-width:90vw;box-shadow:0 4px 18px #0003}
#toast div.err{background:var(--err)}
.mask{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.dlg{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:20px;position:relative}
.dlg .x{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:24px;cursor:pointer}
.qr{display:inline-block;padding:8px;background:#fff}
.muted{color:var(--muted)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:15px}
.pre{white-space:pre-wrap}
.step{display:grid;grid-template-columns:28px 1fr 1fr 1fr 1fr 34px;gap:6px;align-items:start;margin-bottom:8px}
.step .n{font-weight:700;color:var(--acc);padding-top:10px;text-align:center}
.step-h{display:grid;grid-template-columns:28px 1fr 1fr 1fr 1fr 34px;gap:6px;font-size:13px;color:var(--muted)}
@media(max-width:700px){.step,.step-h{grid-template-columns:1fr}.step-h{display:none}.step .n{text-align:left}}
/* 玩家 */
body.playing{background:#12161b;color:#eef0f2}
.play{max-width:900px;margin:0 auto;padding:16px}
.play .bar{display:flex;align-items:center;gap:12px;color:#b9c0c8;padding:6px 0 10px}
.play .bar .sp{flex:1}
.play .timer{font-size:26px;font-variant-numeric:tabular-nums;color:#f3c969;font-weight:700}
.play .timer.low{color:#ff7b6b}
.pcard{background:#1c222a;border:1px solid #2b343f;border-radius:14px;padding:20px;margin-bottom:14px}
.pcard h2{margin:0 0 12px;font-size:24px}
.mem{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.mem input{flex:1 1 40%;margin:0}
.cert{position:relative;background:linear-gradient(160deg,#fbf3dc,#f1e2b8);color:#3b2a10;border-radius:6px;padding:14px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.cert .fr{border:3px double #b0862f;border-radius:4px;padding:26px 22px 22px;text-align:center;position:relative}
.cert .room{font-size:14px;letter-spacing:.3em;color:#8a6a2a;margin:0}
.cert h1{font-size:34px;margin:6px 0 4px;letter-spacing:.2em;font-family:"Noto Serif TC","Songti TC",serif;color:#3b2a10}
.cert .seal{display:inline-block;margin:6px 0 14px;padding:4px 14px;border-radius:99px;font-size:14px;font-weight:700;color:#fff}
.cert .seal.win{background:#2f7d4f}.cert .seal.lose{background:#9a5b2a}
.cert .team{font-size:15px;color:#6b5320;margin:0}
.cert .team b{display:block;font-size:28px;color:#3b2a10;margin-top:4px;font-family:"Noto Serif TC","Songti TC",serif}
.cert .members{font-size:15px;margin:6px 0 0;line-height:1.7}
.cert small.l{color:#8a6a2a;font-size:12px;margin-right:6px}
.cert .lead{font-size:15px;line-height:1.8;margin:12px 0 16px}
.cert .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.cert .stats div{background:rgba(176,134,47,.12);border-radius:8px;padding:8px 4px}
.cert .stats small{display:block;font-size:12px;color:#8a6a2a}.cert .stats span{font-size:17px;font-weight:700}
.cert h3{font-size:16px;margin:0 0 8px;letter-spacing:.15em;color:#6b5320}
.cert table{width:100%;border-collapse:collapse;font-size:15px;text-align:left}
.cert td{padding:7px 6px;border-bottom:1px dashed #cfb376}
.cert td.no{white-space:nowrap;color:#8a6a2a}
.cert td.st{white-space:nowrap;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.cert td.ok{color:#2f7d4f}.cert td.no2{color:#b9a273;font-weight:400}
.cert td.who{text-align:right;white-space:nowrap;font-family:"Noto Serif TC","Songti TC",serif}
.cert tr.hd td{font-size:12px;color:#8a6a2a;font-weight:400;font-family:inherit}
.cert .logo,.cert .stamp{position:absolute;top:70px;width:118px;height:118px;pointer-events:none}
.cert .logo{left:14px;object-fit:contain;opacity:.9}
.cert .stamp{right:14px;border-radius:50%;border:4px double currentColor;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-16deg);font-family:Georgia,"Times New Roman",serif;opacity:.85;mix-blend-mode:multiply}
.cert .stamp b{font-size:22px;letter-spacing:.08em;border-top:2px solid currentColor;border-bottom:2px solid currentColor;padding:2px 4px;margin:4px 0}
.cert .stamp small{font-size:10px;letter-spacing:.15em}
.cert .stamp.win{color:#b3261e}.cert .stamp.lose{color:#5d5d5d}
.cert .foot{margin-top:18px;font-size:13px;color:#6b5320;text-align:right}
@media (max-width:520px){.cert .logo,.cert .stamp{width:88px;height:88px;top:96px}.cert .logo{left:6px}.cert .stamp{right:6px}.cert .stamp b{font-size:16px}.cert .stamp small{font-size:8px}}
.pcard .txt{white-space:pre-wrap;font-size:18px;line-height:1.75}
.pcard img{max-width:100%;border-radius:10px;display:block;margin:10px 0}
.pcard audio{width:100%;margin:10px 0}
.pcard iframe{width:100%;border:0;border-radius:10px;background:#fff;margin:10px 0}
.pcard .cap{color:#aab3bd;font-size:15px}
.propfile{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}.propfile .thumb{max-height:70px;margin:0}.propfile .nm{font-size:14px;word-break:break-all}
.propnote{font-size:13px;color:#555;white-space:pre-wrap;margin-top:4px}
.pdfbadge{display:inline-block;background:#c0392b;color:#fff;font-weight:700;font-size:12px;padding:6px 8px;border-radius:6px}
.pblk.new{animation:blkin 1.6s ease-out}
@keyframes blkin{0%{opacity:0;box-shadow:0 0 0 3px #f3c969;border-radius:10px}40%{opacity:1;box-shadow:0 0 0 3px #f3c969;border-radius:10px}100%{box-shadow:0 0 0 0 transparent}}
.pcard a{color:#9cc9ff}
.pin{width:100%;font-size:24px;padding:14px;border-radius:12px;border:1px solid #3a4552;background:#0e1216;color:#fff;letter-spacing:.05em}
.pbtn{font-size:19px;padding:13px 22px;border-radius:12px;border:0;background:#f3c969;color:#1b1b1b;cursor:pointer;font-weight:700;margin-top:10px}
.pbtn.ghost{background:transparent;color:#f3c969;border:1px solid #f3c969;font-weight:500}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.pmsg{min-height:28px;margin-top:10px;font-size:17px}
.pmsg.bad{color:#ff9b8a}.pmsg.good{color:#8fe0a6}
.phint{border-left:3px solid #f3c969;padding:6px 12px;margin:10px 0;color:#f6e3b3;white-space:pre-wrap}
.phint img{display:block;max-width:100%;max-height:60vh;margin-top:8px;border-radius:8px}
.gate{color:#f3c969;font-size:15px;margin-bottom:8px}
.stars button{font-size:28px;background:transparent;border:0;color:#5a6470;cursor:pointer;padding:2px}
.stars button.on{color:#f3c969}
.play textarea{background:#0e1216;color:#fff;border:1px solid #3a4552}
.flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0e12e6;z-index:60;font-size:40px;font-weight:800;color:#8fe0a6}
.testtag{background:#f3c969;color:#222;border-radius:6px;padding:1px 8px;font-size:13px}
.frags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;color:#aab3bd;font-size:15px}
.frag{min-width:40px;height:44px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:#f3c969;color:#1b1b1b;font-weight:800;font-size:20px}
.frag.empty{background:#2b343f;color:#6f7a86}
.vaultnote{border:1px solid #3d6b4f;background:#16251c;color:#bfe8cc;border-radius:12px;padding:10px 14px;margin-bottom:14px}
.prow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.frag-in{width:70px!important;text-align:center}
.place-in{width:150px!important}
.pplace{display:inline-block;margin:-4px 0 12px;padding:4px 12px;border-radius:999px;background:#2b343f;color:#f3c969;font-size:16px;font-weight:700}
.placebtn{background:none;border:1px solid #3a4652;color:#f3c969;border-radius:999px;padding:4px 12px;font-size:15px;cursor:pointer;white-space:nowrap}
.placetbl{width:100%;border-collapse:collapse;margin-top:14px;font-size:17px}
.placetbl th,.placetbl td{border-bottom:1px solid #2b343f;padding:10px 8px;text-align:left;vertical-align:top}
.placetbl th{color:#9aa4ae;font-size:14px;font-weight:600}
.placetbl td.pl{color:#f3c969;font-weight:700}
.placetbl tr.done td{color:#7f8a95}
.placetbl tr.done td.pl{color:#a7b48a}
.placetbl tr.cur td{background:#232b34}
.board{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.map{margin:0 0 14px}
.map svg{display:block;width:100%;height:auto;border-radius:16px}
.map .mlabel{font-size:24px;font-weight:700;fill:#fff;paint-order:stroke;stroke:#000a;stroke-width:5px;stroke-linejoin:round}
.map .mtitle{font-size:20px;fill:#d7dde3;paint-order:stroke;stroke:#000a;stroke-width:4px}
.map .mmark{font-size:40px;font-weight:800;fill:#5b6b7a}
.map .msmall{font-size:20px;font-weight:700;fill:#fff;paint-order:stroke;stroke:#000a;stroke-width:4px}
.map .mcheck{font-size:20px;font-weight:800;fill:#1b1b1b}
.map .mnode{cursor:pointer}
.map .mnode:hover{filter:brightness(1.18)}
.map .mnode:focus{outline:none}
.map .mnode:focus-visible .hit{stroke:#fff;stroke-width:5}
.maphint{display:flex;gap:10px;align-items:center;color:#9aa4ae;font-size:14px;margin-top:6px}
.maphint button{background:none;border:0;color:#f3c969;font-size:14px;cursor:pointer;padding:4px 0;white-space:nowrap}
.themes{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.themes button{padding:8px 16px;border-radius:10px;border:1px solid var(--line, #ccc);background:#fff;cursor:pointer;font-size:15px}
.themes button.on{border-color:var(--acc);background:var(--acc);color:#fff}
.mapprev{max-width:560px}
.board button{min-width:64px;min-height:48px;padding:6px 12px;border-radius:12px;border:1px solid #3a4552;background:#1d232b;color:#eef0f2;font-size:16px;cursor:pointer;text-align:left;line-height:1.3}
.board button small{display:block;font-size:12px;color:#9aa4ae;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board button.cur{border-color:#f3c969;background:#3a3220;color:#f3c969}
.board button.done{background:#16251c;border-color:#3d6b4f;color:#8fe0a6;cursor:default}
.board button.skip{background:#2b2620;border-color:#6b5a3d;color:#c9b48a;cursor:default}
/* 列印 */
.printonly{display:none}
@media print{.top,.noprint,#toast{display:none!important}.printonly{display:block}body{background:#fff}.card{break-inside:avoid;border-color:#999}.wrap{max-width:none;padding:0}}
.qrsheet{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.qrsheet .cell{border:1px solid #999;border-radius:10px;padding:12px;text-align:center;break-inside:avoid}
/* 等伺服器回應時的提示：按下去的按鈕轉圈、畫面頂端跑一條進度線 */
.busy{position:relative;opacity:.6;cursor:progress!important;pointer-events:none}
.busy::after{content:"";position:absolute;right:8px;top:50%;width:14px;height:14px;margin-top:-7px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
#netbar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:100;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:netbar 1s linear infinite}
#netbar.on{opacity:1}
#offbar{position:fixed;left:0;right:0;top:0;z-index:99;pointer-events:none;display:flex;justify-content:center}
.offb{pointer-events:auto;font-size:14px;padding:6px 14px;border-radius:0 0 10px 10px;color:#fff;max-width:640px;text-align:center}
.offb.warn{background:#b45309}.offb.bad{background:#b91c1c}.offb.ok{background:#15803d}.offb.wait{background:#475569}
.offb.chip{font-size:12px;padding:2px 10px;opacity:.9}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes netbar{from{background-position:-40% 0}to{background-position:140% 0}}

function externalRefs(html) {
  var refs = {}, m;
  var re1 = /(?:src|href)\s*=\s*["']([^"'#]+)["']/gi, re2 = /url\(\s*["']?([^"')]+)["']?\s*\)/gi;
  var skip = /^(https?:|data:|blob:|mailto:|javascript:|\/\/|#|tel:)/i;
  while ((m = re1.exec(html))) if (!skip.test(m[1].trim())) refs[m[1].trim()] = 1;
  while ((m = re2.exec(html))) if (!skip.test(m[1].trim())) refs[m[1].trim()] = 1;

function prepareHtml(file) {

      var d = modal('<h3>這個 HTML 還需要其他檔案</h3><p class="help">檔案裡引用了下面這些檔案。請把它們一起選進來，系統會把它們嵌進 HTML，變成單一檔案。</p><ul>' +

      d.querySelector('#refSkip').onclick = function () { S.onModalClose = null; closeModal(); res(html); };
      d.querySelector('#refOk').onclick = function () {

          var out = html, missing = [];

function openPuzzle(id) {
  var p = (S.ws.puzzles || []).filter(function (x) { return x.id === id; })[0];
  var editable;
  if (S.ws.mode === 'admin') editable = true;
  else if (S.ws.mode === 'teacher' || S.ws.student) editable = !!p.editable;
  else editable = S.ws.editable;
  S.puzzle = clone(p);
  S.edit = { editable: editable, mode: S.ws.mode };
  S.target = 'puzzle';
  S.saver = editable ? makeSaver(function () { return S.puzzle; }, function (d) { return api('savePuzzle', S.code, d); }, function (r) {
    if (r.conflict) {
      toast('這題剛在另一台裝置上改過，已載入那邊的版本，請檢查你剛才打的字', 'err');
      S.puzzle = r.puzzle; renderPuzzleEditor(); return;
    }
    S.puzzle.rev = r.puzzle.rev;
    S.puzzle.checks = r.puzzle.checks;
    if (r.roomChecks) S.ws.roomChecks = r.roomChecks;
    var pc = document.getElementById('pchecks');
    if (pc) pc.innerHTML = checksHtml(S.puzzle.checks);
    var idx = S.ws.puzzles.map(function (x) { return x.id; }).indexOf(S.puzzle.id);
    if (idx >= 0) S.ws.puzzles[idx] = clone(S.puzzle);
  }) : null;
  renderPuzzleEditor();
}
function backFromPuzzle() {
  var saving = leaveEditor();

  if (S.puzzle && S.edit.editable) {
    var idx = (S.ws.puzzles || []).map(function (x) { return x.id; }).indexOf(S.puzzle.id);
    if (idx >= 0) S.ws.puzzles[idx] = Object.assign(clone(S.puzzle), { editable: S.ws.puzzles[idx].editable });
  }
  // 分組和老師：清單馬上回來，等這題存好再到背景更新

/* 玩家角度預覽（只在本機判斷答案，不會記錄） */
function previewPuzzle(p) {
  var gates = [];
  (p.steps || []).forEach(function (s) { if (String(s.checkpoint || '').trim()) gates.push({ label: s.result || '中途答案', answers: splitAns(s.checkpoint) }); });
  gates.push({ label: '答案', answers: splitAns(p.answer) });
  var g = 0;
  var d = modal('<div style="background:#12161b;color:#eef0f2;border-radius:12px;padding:6px 14px 14px;margin-top:22px"><div class="pcard" style="margin-top:12px"><h2>' + esc(p.title) + '</h2><div id="pvBlocks"></div></div>' +
    '<div class="pcard"><div class="gate" id="pvGate"></div><input class="pin" id="pvIn" autocomplete="off"><button class="pbtn" id="pvGo">送出</button><div class="pmsg" id="pvMsg"></div>' +
    (p.hints || []).filter(function (x) { return String(x.text || '').trim() || x.imageId; }).map(function (x, i) { return '<div class="phint">提示 ' + (i + 1) + '（開始後 ' + (x.delaySec || 0) + ' 秒）：' + esc(x.text) + (x.imageId ? '<img data-file="' + esc(x.imageId) + '" alt="提示圖片">' : '') + '</div>'; }).join('') + '</div></div>');
  var setGate = function () { d.querySelector('#pvGate').textContent = gates.length > 1 ? '第 ' + (g + 1) + ' / ' + gates.length + ' 步：' + gates[g].label : '答案'; };
  setGate();
  renderPlayBlocks(d.querySelector('#pvBlocks'), (p.blocks || []).map(function (b) { return b; }), true, p.steps);
  d.querySelectorAll('.phint img[data-file]').forEach(function (el) { hydrateFiles(el.parentNode); });
  var coolSec = Number(((S.me || {}).settings || {}).wrongCooldownSec) || 0, coolAt = 0;
  var cool = function () { // 答錯冷卻：跟正式遊玩一樣，等幾秒才能再答
    var btn = d.querySelector('#pvGo'), m = d.querySelector('#pvMsg');
    if (!btn || !document.body.contains(btn)) return;
    var left = Math.ceil((coolAt - Date.now()) / 1000);
    if (left > 0) { btn.disabled = true; m.className = 'pmsg bad'; m.textContent = '答案不對，' + left + ' 秒後可以再答'; setTimeout(cool, 250); }
    else { btn.disabled = false; m.className = 'pmsg'; m.textContent = ''; }
  };
  d.querySelector('#pvGo').onclick = function () {
    if (Date.now() < coolAt) return;
    var v = d.querySelector('#pvIn').value, m = d.querySelector('#pvMsg');
    if (norm(v) && gates[g].answers.some(function (a) { return norm(a) === norm(v); })) {
      if (g < gates.length - 1) {
        g++; setGate(); d.querySelector('#pvIn').value = '';
        var nb = gateBlocks(d.querySelector('#pvBlocks'), g);
        m.className = 'pmsg good'; m.textContent = nb ? '正確！新的線索出現了' : '正確！繼續下一步';
        if (nb && nb.scrollIntoView) nb.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      else { m.className = 'pmsg good'; m.textContent = '答對了！這題完成'; }
    } else if (coolSec > 0) { coolAt = Date.now() + coolSec * 1000; cool(); }
    else { m.className = 'pmsg bad'; m.textContent = '答案不對'; }
  };
}

      if (r.conflict) { toast('剛被別人改過，已載入最新版本', 'err'); S.room = r.room; renderRoomEditor(); return; }

function renderPlayBlocks(el, blocks, local, steps) {
  el.innerHTML = (blocks || []).map(function (b, i) {
    var g = local ? blockGate(b, steps) : Number(b.after) || 0, inner = playBlockHtml(b, i, local);
    return g > 0 ? '<div class="pblk" data-after="' + g + '" hidden>' + inner + '</div>' : inner;
  }).join('');
  el.querySelectorAll('iframe[data-hi]').forEach(function (f) {
    var b = blocks[Number(f.getAttribute('data-hi'))];
    if (!local) { f.srcdoc = b.html; return; }
    if (b.fileId) fileData(b.fileId).then(function (d) { f.srcdoc = d.text || ''; });
  });
  if (local) hydrateFiles(el);
}
/** 已經過了幾道關卡：把可以出現的區塊打開，回傳這次新打開的第一個 */
function gateBlocks(el, gate) {
  var first = null;
  if (!el) return null;
  el.querySelectorAll('.pblk[data-after]').forEach(function (d) {
    var open = gate >= Number(d.getAttribute('data-after'));
    if (open && d.hidden) { d.hidden = false; d.classList.add('new'); if (!first) first = d; }
    else if (!open) d.hidden = true;
  });
  return first;
}
function playBlockHtml(b, i, local) {
  if (b.type === 'text') return '<div class="txt">' + esc(b.text) + '</div>';
  if (b.type === 'image') return '<img ' + (local ? 'data-file="' + esc(b.fileId) + '"' : 'src="' + b.src + '"') + ' alt="">' + (b.caption ? '<div class="cap">' + esc(b.caption) + '</div>' : '');
  if (b.type === 'audio') return '<audio controls ' + (local ? 'data-file="' + esc(b.fileId) + '"' : 'src="' + b.src + '"') + '></audio>' + (b.caption ? '<div class="cap">' + esc(b.caption) + '</div>' : '');
  if (b.type === 'link') return '<p><a target="_blank" rel="noopener" href="' + esc(b.url) + '">🔗 ' + esc(b.label || b.url) + '</a></p>';
  if (b.type === 'html') return '<iframe sandbox="allow-scripts allow-popups allow-forms" data-hi="' + i + '" style="height:' + (Number(b.height) || 520) + 'px"></iframe>';
  return '';
}
function tickPlay() {
  var P = S.play;
  if (!P || S.view !== 'play') return;
  var left = Math.max(0, Math.ceil((P.deadline - Date.now()) / 1000));
  var tm = document.getElementById('tm');
  if (tm) { tm.textContent = fmtSec(left); tm.className = 'timer' + (left < 120 ? ' low' : ''); }
  if (left <= 0 && !P.timingOut) {
    P.timingOut = true;
    api('playState', P.id, P.pid).then(function (st) { P.timingOut = false; applyPlayState(st); }).catch(function () { P.timingOut = false; });
    return;
  }
  var hb = document.getElementById('hintBtn');
  if (hb) {
    var w = P.hintAt < 0 ? -1 : Math.ceil((P.hintAt - Date.now()) / 1000);
    var n = P.state.hintsShown.length + 1;
    hb.disabled = w > 0;
    hb.textContent = w > 0 ? '提示 ' + n + '（' + w + ' 秒後可看）' : '看提示 ' + n;
  }
  var gb = document.getElementById('goBtn');
  if (gb) {
    var c = Math.ceil((P.coolAt - Date.now()) / 1000);
    gb.disabled = c > 0 || P.busy;
    gb.textContent = c > 0 ? '請等 ' + c + ' 秒' : '送出';
  }
}
function sendAnswer() {
  var P = S.play, inp = document.getElementById('ans');
  if (!inp || P.busy) return;
  var v = inp.value;
  if (!v.trim()) { var m = document.getElementById('pmsg'); m.className = 'pmsg bad'; m.textContent = '請先輸入答案'; return; }
  if (Date.now() < P.coolAt) return;
  P.busy = true; tickPlay();
  api('playAnswer', P.id, v).then(function (r) {
    P.busy = false;
    var st = r.state;
    if (r.solved) {
      var won = r.escaped || (r.escaped === undefined && st.result === 'escaped');
      flash(won ? '逃脫成功！' : r.fragment ? '解開了！拿到碎片「' + r.fragment + '」' : '解開了！', function () { applyPlayState(st); });
      return;
    }
    P.state = st;
    P.deadline = Date.now() + st.remainingSec * 1000;
    P.hintAt = st.nextHintInSec >= 0 ? Date.now() + st.nextHintInSec * 1000 : -1;
    P.coolAt = Date.now() + (st.cooldownSec || 0) * 1000;
    if (isOver(st)) return showEnding(st);
    if (r.gatePassed) return renderPlay('正確！繼續下一步', true);
    if (r.wait) return renderPlay('請稍等再作答');
    renderPlay('答案不對，再想想');
  }).catch(function (e) { P.busy = false; fail(e); });
}
function flash(text, then) {
  var f = document.createElement('div');
  f.className = 'flash'; f.textContent = text;
  document.body.appendChild(f);
  setTimeout(function () { f.remove(); then(); }, 1100);
}
function askSkip() {
  var P = S.play, st = P.state;
  var go = function () {
    api('playSkip', P.id).then(function (r) {
      if (r.escaped) return flash('逃脫成功！', function () { applyPlayState(r.state); });
      if (r.fragment) return flash('跳過了，拿到碎片「' + r.fragment + '」', function () { applyPlayState(r.state); });
      applyPlayState(r.state);
    }).catch(fail);
  };
  if (st.phase === 'vault') return go();
  confirmBox('跳過這一題會扣 ' + st.skipMin + ' 分鐘' + (st.finale ? '，但照樣拿到這一題的碎片' : '') + '。確定要跳過嗎？', '跳過').then(function (ok) { if (ok) go(); });
}
function finishVault() {
  confirmBox('結束遊戲？寶庫剩下的題目就不玩了，逃脫時間不受影響。', '結束').then(function (ok) {
    if (ok) api('playFinish', S.play.id).then(function (r) { applyPlayState(r.state); }).catch(fail);
  });
}
/* 提示圖片另外抓，抓過就記住，不會每次作答都重傳 */
function loadHintImages(st) {
  var P = S.play;
  P.hintImg = P.hintImg || {};
  document.querySelectorAll('#panel img[data-hint-img]').forEach(function (img) {
    var n = Number(img.getAttribute('data-hint-img')), key = st.puzzleId + ':' + n;
    if (P.hintImg[key]) { img.src = P.hintImg[key]; return; }
    api('playHintImage', P.id, n).then(function (r) {
      if (!r.src) return;
      P.hintImg[r.puzzleId + ':' + r.n] = r.src;
      var el = document.querySelector('#panel img[data-hint-img="' + n + '"]');
      if (el && st.puzzleId === r.puzzleId) el.src = r.src;
    }).catch(function () { });
  });
}
function askHint() {
  var P = S.play;
  api('playHint', P.id).then(function (r) { applyPlayState(r.state); }).catch(fail);
}
function showEnding(st) {
  clearTimers();
  var P = S.play;
  savePlayRef(true);
  S.view = 'playEnd';
  setTimeout(OFF.paint, 0);
  var e = st.ending || {};
  var h = '<div class="play">' + certHtml(st) + '<div class="pcard"><h2>' + (st.result === 'escaped' ? '逃脫成功！' : '時間到') + '</h2>' + (e.image ? '<img src="' + e.image + '">' : '') + '<div class="txt">' + esc(e.text) + '</div>' +
    '<p style="color:#aab3bd">用時 ' + fmtSec(st.elapsedSec) + (st.penaltySec ? '（含跳過扣時 ' + Math.round(st.penaltySec / 60) + ' 分鐘）' : '') +
    (st.vaultTotal && st.result === 'escaped' ? '　寶庫寶物 ' + st.vaultSolved + ' / ' + st.vaultTotal + ' 件' : '') + '</p></div>';
  h += '<div class="pcard"><h2>幫每一題評難易度</h2><p style="color:#aab3bd">1 顆星最容易，5 顆星最難。</p>' + (st.rateList || []).map(function (q) {
    return '<div style="margin:10px 0"><div>' + esc(q.label || '第 ' + q.no + ' 題') + '　' + esc(q.title) + '</div><div class="stars">' + [1, 2, 3, 4, 5].map(function (v) {
      return '<button data-act="star" data-pid="' + esc(q.id) + '" data-v="' + v + '" aria-label="' + v + ' 顆星">★</button>';
    }).join('') + '</div></div>';
  }).join('') +
    '<label style="display:block;margin-top:12px">最喜歡哪一題？為什麼？</label><textarea id="liked" style="width:100%;min-height:70px;border-radius:10px;padding:10px"></textarea>' +
    '<label style="display:block;margin-top:12px">最卡在哪裡？有沒有覺得不公平的地方？</label><textarea id="stuck" style="width:100%;min-height:70px;border-radius:10px;padding:10px"></textarea>' +
    '<button class="pbtn" data-act="sendRate">送出回饋</button></div></div>';
  app.innerHTML = h;
}

function certHtml(st) {
  var c = st.cert;
  if (!c) return '';
  var win = st.result === 'escaped';
  var n = c.puzzles.filter(function (p) { return p.sec !== null; }).length;
  var mmss = function (s) { s = Math.max(0, Math.round(s)); return ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + s % 60).slice(-2); };
  return '<div class="cert"><div class="fr"><img class="logo" alt="資優班班徽" src="' + CERT_LOGO + '">' +
    '<div class="stamp ' + (win ? 'win' : 'lose') + '"><small>★ ESCAPE ★</small><b>' + (win ? 'SUCCESS' : 'FAILED') + '</b><small>' + (win ? mmss(st.elapsedSec) : 'TIME UP') + '</small></div>' +
    '<p class="room">' + esc(c.room) + '</p><h1>' + (win ? '逃脫證書' : '挑戰證書') + '</h1>' +
    '<span class="seal ' + (win ? 'win' : 'lose') + '">' + (win ? '★ 成功逃脫' : '勇敢挑戰到最後一刻') + '</span>' +
    '<p class="team">茲證明<b>' + esc(c.team) + '</b></p>' +
    (c.members.length ? '<p class="members"><small class="l">闖關成員</small>' + c.members.map(esc).join('、') + '</p>' : '') +
    '<p class="lead">' + (win ? (n === c.puzzles.length ? '運用推理與合作，解開全部關卡，成功逃出密室。' : '運用推理與合作，成功逃出密室。') : '在時限內奮戰到最後，解開了 ' + n + ' 道關卡。') + '</p>' +
    '<div class="stats"><div><small>' + (win ? '逃脫時間' : '挑戰時間') + '</small><span>' + mmss(st.elapsedSec) + '</span></div>' +
    '<div><small>解開關卡</small><span>' + n + ' / ' + c.puzzles.length + '</span></div>' +
    '<div><small>日期</small><span style="font-size:14px">' + esc(c.date) + '</span></div></div>' +
    '<h3>— 關卡與設計者 —</h3><table><tr class="hd"><td class="no">關卡</td><td>名稱</td><td class="st">過關用時</td><td class="who">設計者</td></tr>' +
    c.puzzles.map(function (p, i) {
      var ok = p.sec !== null;
      return '<tr><td class="no">第 ' + (i + 1) + ' 關</td><td>' + esc(p.title) + '</td><td class="st ' + (ok ? 'ok' : 'no2') + '">' + (ok ? '✓ ' + mmss(p.sec) : '未解開') + '</td><td class="who">' + (p.author ? '<small class="l">設計者</small>' + esc(p.author) : '') + '</td></tr>';
    }).join('') + '</table><div class="foot">密室工坊・闖關紀錄自動產生</div></div></div>';
}
function finishRate() {
  var P = S.play;
  var list = Object.keys(P.rate).map(function (k) { return { id: k, rating: P.rate[k] }; });
  api('playRate', P.id, list, document.getElementById('liked').value, document.getElementById('stuck').value).then(function () {
    app.innerHTML = '<div class="play"><div class="pcard center"><h2>謝謝你的回饋！</h2>' +
      (P.test && S.code ? '<button class="pbtn" data-act="backFromTest">回到編輯</button>' : '<button class="pbtn ghost" data-act="toLogin">回到首頁</button>') + '</div></div>';
  }).catch(fail);
}

app.addEventListener('input', function (e) {
  var t = e.target, f = t.getAttribute('data-f');
  if (t.hasAttribute('data-asmplace') && S.assemble) { S.assemble.places[t.getAttribute('data-asmplace')] = t.value; return; }
  if (t.hasAttribute('data-plid') && S.placesEdit) { S.placesEdit.places[t.getAttribute('data-plid')] = t.value; return; }
  if (t.hasAttribute('data-asmfrag') && S.assemble) {
    S.assemble.frags[Number(t.getAttribute('data-asmfrag'))] = t.value;
    var j = document.getElementById('asmJoined');
    if (j) j.textContent = S.assemble.frags.join('');
    return;
  }
  if (!f || !S.saver) return;
  var obj = S.target === 'room' ? S.room : S.puzzle;
  var v = t.value;
  if (t.getAttribute('data-num')) v = v === '' ? '' : Number(v);
  setPath(obj, f, v);
  S.saver.touch();
});
app.addEventListener('change', function (e) {
  var t = e.target;
  // 管理者換組：選了就存，題目預設跟著人走
  if (t.getAttribute('data-assign')) {
    var sc = t.getAttribute('data-assign'), keep = document.getElementById('keepPz');
    t.disabled = true;
    netBusy(true);
    apiRaw('adminAssignStudent', S.code, sc, t.value, { keepPuzzles: !!(keep && keep.checked) }).then(function (r) {
      netBusy(false);
      toast(r.moved ? '已換組，' + r.moved + ' 題一起移過去' : '已換組');
      showAdmin('students');
    }).catch(function (err) { netBusy(false); fail(err); showAdmin('students'); });
    return;
  }
  if (t.getAttribute('data-check') && S.saver) {
    setPath(S.target === 'room' ? S.room : S.puzzle, t.getAttribute('data-check'), t.checked);
    S.saver.touch();
    if (S.target === 'room') renderRoomEditor();
    return;
  }
  if (t.tagName === 'SELECT' && t.getAttribute('data-f') && S.saver) {
    setPath(S.target === 'room' ? S.room : S.puzzle, t.getAttribute('data-f'), t.getAttribute('data-num') ? Number(t.value) : t.value);
    S.saver.touch();
    if (/^blocks\.\d+\.after$/.test(t.getAttribute('data-f'))) { renderPuzzleEditor(); return; }
    if (S.target === 'room' && t.getAttribute('data-f') === 'mode') renderRoomEditor();
    return;
  }
  var up = t.getAttribute('data-upload');
  if (!up || !t.files || !t.files[0]) return;
  var file = t.files[0];
  if (up === 'block' || up === 'html') {
    var i = Number(t.getAttribute('data-i')), b = S.puzzle.blocks[i];
    var meta = { roomId: S.puzzle.roomId, puzzleId: S.puzzle.id, label: BLOCK_TYPES[b.type] };
    var job = up === 'html'
      ? prepareHtml(file).then(function (html) {
          if (html === null) return null;
          toast('上傳中…');
          return api('uploadFile', S.code, { roomId: S.puzzle.roomId, puzzleId: S.puzzle.id, label: 'HTML', name: file.name, mime: 'text/html' }, html, true)
            .then(function (r) { S.fileCache[r.fileId] = { mime: 'text/html', text: html }; r.fileName = file.name; return r; });
        })
      : uploadMedia(file, b.type, meta);
    job.then(function (r) {
      if (!r) return;
      b.fileId = r.fileId;
      if (r.fileName) b.fileName = r.fileName;
      toast('上傳完成');
      S.saver.touch();
      renderPuzzleEditor();
    }).catch(fail);
  }
  if (up === 'propfile') {
    var pi = Number(t.getAttribute('data-i')), pp = S.puzzle;
    var pitem = String((pp.props[pi] || {}).item || '').trim();
    var prep;
    // 小的 PNG／JPG、PDF 用原檔；手機照片（HEIC、太大張）轉成 A4 300 dpi 以內的 JPG
    preparePrintFile(file).then(function (x) {
      prep = x;
      var pf = x.file;
      try { if (!pf.type) pf = new File([pf], pf.name || file.name, { type: x.mime }); } catch (e) { }
      return uploadMedia(pf, 'file', { roomId: pp.roomId, puzzleId: pp.id, label: '列印檔' + (pitem ? '-' + pitem : '') });
    }).then(function (r) {
      if (!pp.props[pi]) return;
      pp.props[pi].fileId = r.fileId;
      pp.props[pi].fileName = prep.file.name || file.name;
      pp.props[pi].fileMime = prep.mime;
      toast(prep.converted ? '上傳完成（照片已轉成適合列印的 JPG）' : '上傳完成');
      S.saver.touch();
      renderPuzzleEditor();
    }).catch(function (e) { t.value = ''; fail(e); });
  }
  if (up === 'hintimg') {
    var hi = Number(t.getAttribute('data-i')), hp = S.puzzle;
    uploadMedia(file, 'image', { roomId: hp.roomId, puzzleId: hp.id, label: '提示圖片' }).then(function (r) {
      if (!hp.hints[hi]) return;
      hp.hints[hi].imageId = r.fileId;
      toast('上傳完成');
      S.saver.touch();
      renderPuzzleEditor();
    }).catch(fail);
  }
  if (up === 'roomimg' || up === 'mindmap') {
    var path = up === 'mindmap' ? 'mindmap.fileId' : t.getAttribute('data-path');
    uploadMedia(file, /pdf/.test(file.type) ? 'file' : 'image', { roomId: S.room.id, label: up === 'mindmap' ? '心智圖' : t.getAttribute('data-label') }).then(function (r) {
      setPath(S.room, path, r.fileId);
      toast('上傳完成');
      S.saver.touch();
      renderRoomEditor();
    }).catch(fail);
  }
});
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled || el.classList.contains('busy')) return;
  S.click = { el: el, at: Date.now() };
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  if (el.tagName === 'A') e.preventDefault();
  var A = ACTIONS[act];
  if (A) A(el, id);
});
var ACTIONS = {
  closeModal: function () { closeModal(); },
  login: function () { var c = document.getElementById('code').value.trim(); if (!c) return toast('請輸入代碼', 'err'); doLogin(c); },
  tlogin: function () { var c = document.getElementById('tcode').value.trim(); if (!c) return toast('請輸入代碼', 'err'); doLogin(c); },

  },
  setLeader: function (el) {
    api('adminSetLeader', S.code, el.getAttribute('data-room'), el.getAttribute('data-code') || '').then(function () { showAdmin('students'); }).catch(fail);
  },
  createGroupNames: function () {
    var names = document.getElementById('newGroupNames').value.split(/[\n,，、]+/).map(function (x) { return x.trim(); }).filter(Boolean);
    if (!names.length) return toast('請先輸入組名', 'err');
    var have = S.admin.data.rooms.filter(function (r) { return r.kind === 'group'; }).map(function (r) { return r.groupName; });
    var dup = names.filter(function (n) { return have.indexOf(n) >= 0; });
    if (dup.length) return toast('已經有「' + dup.join('、') + '」了', 'err');
    api('adminCreateGroups', S.code, names.map(function (n) { return { name: n }; })).then(function (r) { toast('已建立 ' + r.length + ' 組'); showAdmin('students'); }).catch(fail);
  },
  saveStudent: function (el) {
    var c = el.getAttribute('data-code');
    api('adminUpdateStudent', S.code, c, { name: document.querySelector('[data-stname="' + c + '"]').value, school: document.querySelector('[data-stschool="' + c + '"]').value })
      .then(function () { toast('已儲存'); showAdmin('students'); }).catch(fail);
  },
  hideStudentName: function (el) {
    var c = el.getAttribute('data-code'), on = el.checked;
    api('adminUpdateStudent', S.code, c, { hideName: on }).then(function () {
      (S.admin.data.students || []).forEach(function (x) { if (x.code === c) x.hideName = on; });
      toast(on ? '密室島不會出現他的名字' : '密室島會公開他的名字');
    }).catch(function (e) { el.checked = !on; fail(e); });
  },
  unbindStudent: function (el) {
    var c = el.getAttribute('data-code'), st = S.admin.data.students.filter(function (x) { return x.code === c; })[0];
    confirmBox('解除「' + st.name + '」和 ' + st.email + ' 的綁定？\n之後他要用新的 Google 帳號登入，並在第一次登入時輸入個人代碼 ' + c + '。', '解除綁定').then(function (ok) {
      if (ok) api('adminUpdateStudent', S.code, c, { clearEmail: true }).then(function () { toast('已解除綁定'); showAdmin('students'); }).catch(fail);
    });
  },
  deleteStudent: function (el) {
    var c = el.getAttribute('data-code'), st = S.admin.data.students.filter(function (x) { return x.code === c; })[0];
    confirmBox('確定要刪除「' + st.name + '」嗎？（' + (st.email || c) + '）', '刪除').then(function (ok) {
      if (ok) api('adminDeleteStudent', S.code, c).then(function () { toast('已刪除'); showAdmin('students'); }).catch(fail);
    });
  },
  createStudents: function () {
    var list = document.getElementById('newStudents').value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean).map(function (l) {
      var m = l.split(/[:：]/); return { name: m[0].trim(), school: (m[1] || '').trim() };
    });
    if (!list.length) return toast('請先輸入姓名', 'err');
    api('adminCreateStudents', S.code, list).then(function (r) { toast('已建立 ' + r.length + ' 位：' + r.map(function (x) { return x.name + ' ' + x.code; }).join('、')); showAdmin('students'); }).catch(fail);
  },
  saveSettings: function () {
    var data = {};
    document.querySelectorAll('[data-set]').forEach(function (i) { data[i.getAttribute('data-set')] = i.type === 'checkbox' ? i.checked : i.value; });
    api('adminSaveSettings', S.code, data).then(function (s) { S.me.settings = s; S.admin.data.settings = s; toast('已儲存設定'); }).catch(fail);
  }
};
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'code') ACTIONS.login();
  if (e.key === 'Enter' && e.target.id === 'tcode') ACTIONS.tlogin();
  if (e.key === 'Enter' && e.target.id === 'pcode') ACTIONS.toPlay();
  // 地圖上的島／拼圖／星球是 SVG，要自己處理鍵盤操作
  var t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button' && t.getAttribute('data-act') && t.tagName.toLowerCase() === 'g') {
    e.preventDefault();
    var A = ACTIONS[t.getAttribute('data-act')];
    if (A) A(t, t.getAttribute('data-id'));
  }
});
boot();
</script>
</body>
</html>
