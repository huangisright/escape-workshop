<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#22252a;--muted:#6b6f76;--line:#e2ddd2;--acc:#1f6f6b;--acc2:#e7f2f1;--err:#c0392b;--errbg:#fdecea;--warn:#b7791f;--warnbg:#fdf4e3;--ok:#2f855a;--okbg:#e9f6ee;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit}
.top{position:sticky;top:0;z-index:20;background:#22252a;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.top .brand{font-weight:700;letter-spacing:.05em}
.top .who{opacity:.8;font-size:14px}
.top .sp{flex:1}
.top button{background:transparent;color:#fff;border:1px solid #fff5;border-radius:8px;padding:6px 12px;cursor:pointer}
.status{font-size:13px;opacity:.85}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 14px}
.card h3{margin:0 0 10px;font-size:18px}
.card h3 .no{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;text-align:center;line-height:26px;font-size:14px;margin-right:6px}
.help{color:var(--muted);font-size:14px;margin:0 0 10px}
label.f{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],input[type=url],textarea,select{width:100%;padding:10px 12px;border:1px solid #cfc9bd;border-radius:10px;background:#fff;color:var(--ink)}
input:disabled,textarea:disabled,select:disabled{background:#f3f1ec;color:#555}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:140px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.ghost{background:#fff;color:var(--acc)}
.btn.sm{padding:6px 10px;font-size:14px;font-weight:500}
.btn.danger{background:#fff;color:var(--err);border-color:var(--err)}
.btn.warn{background:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--acc);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--acc);padding:9px 18px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.chip{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:#eee;color:#444;white-space:nowrap}
.chip.draft{background:#eef1f5;color:#3b4a5e}.chip.submitted{background:var(--warnbg);color:var(--warn)}.chip.approved{background:var(--okbg);color:var(--ok)}
.chip.pub{background:var(--acc2);color:var(--acc)}
.dots{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.err{background:var(--err)}.dot.warn{background:#e0a72e}.dot.ok{background:var(--ok)}
.checks{list-style:none;padding:0;margin:0}
.checks li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:15px}
.checks li .dot{margin-top:7px;flex:none}
.checks li.err{color:var(--err)}.checks li.warn{color:#8a5a12}.checks li.ok{color:var(--ok)}
.sub{border:1px dashed var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#fcfbf8}
.sub .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:600}
.sub .hd .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;cursor:pointer;font-size:14px}
.thumb{max-width:260px;max-height:180px;border-radius:8px;border:1px solid var(--line);display:block;margin:6px 0;background:#eee;min-height:40px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600}
.item .m{font-size:14px;color:var(--muted)}
.item.click{cursor:pointer}
.item.click:hover{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.banner{border-radius:12px;padding:12px 16px;margin-bottom:14px;background:var(--warnbg);color:#7a4f0f;border:1px solid #f1d9a8}
.banner.ok{background:var(--okbg);color:var(--ok);border-color:#bfe3cc}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-size:16px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
.center{text-align:center}
.big{font-size:28px;font-weight:700;letter-spacing:.1em}
.login{max-width:440px;margin:8vh auto;padding:0 16px}
.login h1{font-size:30px;margin:0 0 6px}
.login .card{padding:22px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:#22252a;color:#fff;padding:10px 18px;border-radius:10px;max-width:90vw;box-shadow:0 4px 18px #0003}
#toast div.err{background:var(--err)}
.mask{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.dlg{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:20px;position:relative}
.dlg .x{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:24px;cursor:pointer}
.qr{display:inline-block;padding:8px;background:#fff}
.muted{color:var(--muted)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:15px}
.pre{white-space:pre-wrap}
.step{display:grid;grid-template-columns:28px 1fr 1fr 1fr 1fr 34px;gap:6px;align-items:start;margin-bottom:8px}
.step .n{font-weight:700;color:var(--acc);padding-top:10px;text-align:center}
.step-h{display:grid;grid-template-columns:28px 1fr 1fr 1fr 1fr 34px;gap:6px;font-size:13px;color:var(--muted)}
@media(max-width:700px){.step,.step-h{grid-template-columns:1fr}.step-h{display:none}.step .n{text-align:left}}
/* 玩家 */
body.playing{background:#12161b;color:#eef0f2}
.play{max-width:900px;margin:0 auto;padding:16px}
.play .bar{display:flex;align-items:center;gap:12px;color:#b9c0c8;padding:6px 0 10px}
.play .bar .sp{flex:1}
.play .timer{font-size:26px;font-variant-numeric:tabular-nums;color:#f3c969;font-weight:700}
.play .timer.low{color:#ff7b6b}
.pcard{background:#1c222a;border:1px solid #2b343f;border-radius:14px;padding:20px;margin-bottom:14px}
.pcard h2{margin:0 0 12px;font-size:24px}
.pcard .txt{white-space:pre-wrap;font-size:18px;line-height:1.75}
.pcard img{max-width:100%;border-radius:10px;display:block;margin:10px 0}
.pcard audio{width:100%;margin:10px 0}
.pcard iframe{width:100%;border:0;border-radius:10px;background:#fff;margin:10px 0}
.pcard .cap{color:#aab3bd;font-size:15px}
.pcard a{color:#9cc9ff}
.pin{width:100%;font-size:24px;padding:14px;border-radius:12px;border:1px solid #3a4552;background:#0e1216;color:#fff;letter-spacing:.05em}
.pbtn{font-size:19px;padding:13px 22px;border-radius:12px;border:0;background:#f3c969;color:#1b1b1b;cursor:pointer;font-weight:700;margin-top:10px}
.pbtn.ghost{background:transparent;color:#f3c969;border:1px solid #f3c969;font-weight:500}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.pmsg{min-height:28px;margin-top:10px;font-size:17px}
.pmsg.bad{color:#ff9b8a}.pmsg.good{color:#8fe0a6}
.phint{border-left:3px solid #f3c969;padding:6px 12px;margin:10px 0;color:#f6e3b3;white-space:pre-wrap}
.gate{color:#f3c969;font-size:15px;margin-bottom:8px}
.stars button{font-size:28px;background:transparent;border:0;color:#5a6470;cursor:pointer;padding:2px}
.stars button.on{color:#f3c969}
.play textarea{background:#0e1216;color:#fff;border:1px solid #3a4552}
.flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0e12e6;z-index:60;font-size:40px;font-weight:800;color:#8fe0a6}
.testtag{background:#f3c969;color:#222;border-radius:6px;padding:1px 8px;font-size:13px}
.frags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;color:#aab3bd;font-size:15px}
.frag{min-width:40px;height:44px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:#f3c969;color:#1b1b1b;font-weight:800;font-size:20px}
.frag.empty{background:#2b343f;color:#6f7a86}
.vaultnote{border:1px solid #3d6b4f;background:#16251c;color:#bfe8cc;border-radius:12px;padding:10px 14px;margin-bottom:14px}
.prow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.frag-in{width:70px!important;text-align:center}
/* 列印 */
.printonly{display:none}
@media print{.top,.noprint,#toast{display:none!important}.printonly{display:block}body{background:#fff}.card{break-inside:avoid;border-color:#999}.wrap{max-width:none;padding:0}}
.qrsheet{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.qrsheet .cell{border:1px solid #999;border-radius:10px;padding:12px;text-align:center;break-inside:avoid}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal"></div>
<script>
/* ============================================================
   共用
   ============================================================ */
var S = {
  code: null, me: null, view: '', target: '', puzzle: null, room: null, ws: null, edit: {},
  fileCache: {}, admin: { tab: 'overview', data: null }, play: null, saver: null, timers: []
};
var app = document.getElementById('app');

function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) {
      rej(e && e.message ? e : new Error(String(e)));
    });
    r[fn].apply(r, args);
  });
}
function toast(msg, kind) {
  var t = document.createElement('div');
  t.textContent = msg;
  if (kind) t.className = kind;
  document.getElementById('toast').appendChild(t);
  setTimeout(function () { t.remove(); }, kind === 'err' ? 5000 : 2600);
}
function fail(e) { toast((e && e.message) || String(e), 'err'); }
function modal(html, onClose) {
  var m = document.getElementById('modal');
  m.innerHTML = '<div class="mask"><div class="dlg"><button class="x" data-act="closeModal" aria-label="關閉">×</button>' + html + '</div></div>';
  S.onModalClose = onClose || null;
  return m.querySelector('.dlg');
}
function closeModal() {
  document.getElementById('modal').innerHTML = '';
  if (S.onModalClose) { var f = S.onModalClose; S.onModalClose = null; f(); }
}
function confirmBox(msg, okText) {
  return new Promise(function (res) {
    var d = modal('<p style="font-size:17px;margin-top:20px" class="pre">' + esc(msg) + '</p><div class="btns"><button class="btn" id="cfOk">' + esc(okText || '確定') + '</button><button class="btn ghost" id="cfNo">取消</button></div>', function () { res(false); });
    d.querySelector('#cfOk').onclick = function () { S.onModalClose = null; closeModal(); res(true); };
    d.querySelector('#cfNo').onclick = function () { closeModal(); };
  });
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function clearTimers() { S.timers.forEach(clearInterval); S.timers = []; }
function getPath(o, path) { return path.split('.').reduce(function (x, k) { return x == null ? x : x[k]; }, o); }
function setPath(o, path, v) {
  var ks = path.split('.'), last = ks.pop();
  var t = ks.reduce(function (x, k) { if (x[k] == null) x[k] = /^\d+$/.test(k) ? [] : {}; return x[k]; }, o);
  t[last] = v;
}
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function norm(s) {
  s = String(s == null ? '' : s);
  try { s = s.normalize('NFKC'); } catch (e) { }
  s = s.replace(/[！-～]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/　/g, ' ');
  return s.toLowerCase().replace(/臺/g, '台').replace(/[\s，,。．.、；;：:！!？?「」『』“”"'‘’（）()【】\[\]]/g, '');
}
function splitAns(s) { return String(s || '').split(/[\/／\n]/).map(function (x) { return x.trim(); }).filter(Boolean); }
function fmtSec(s) { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
function statusChip(st) { return '<span class="chip ' + esc(st) + '">' + ({ draft: '製作中', submitted: '已送審', approved: '審核通過' }[st] || st) + '</span>'; }
function sumDots(sm) {
  if (!sm) return '';
  var h = '<span class="dots">';
  if (sm.err) h += '<span class="dot err"></span>' + sm.err;
  if (sm.warn) h += '<span class="dot warn"></span>' + sm.warn;
  if (!sm.err && !sm.warn) h += '<span class="dot ok"></span>完成';
  return h + '</span>';
}
function summarize(checks) {
  return { err: (checks || []).filter(function (c) { return c.level === 'err'; }).length, warn: (checks || []).filter(function (c) { return c.level === 'warn'; }).length };
}
function checksHtml(checks) {
  if (!checks || !checks.length) return '';
  var order = { err: 0, warn: 1, ok: 2 };
  return '<ul class="checks">' + checks.slice().sort(function (a, b) { return order[a.level] - order[b.level]; }).map(function (c) {
    return '<li class="' + c.level + '"><span class="dot ' + c.level + '"></span><span>' + esc(c.msg) + '</span></li>';
  }).join('') + '</ul>';
}
function kindLabel(k) { return k === 'digital' ? '數位' : k === 'physical' ? '實體' : '未選'; }
function topbar(title, opts) {
  opts = opts || {};
  return '<div class="top noprint">' + (opts.back ? '<button data-act="' + opts.back + '">← 返回</button>' : '') +
    '<span class="brand">' + esc(title) + '</span>' + (opts.extra || '') + '<span class="sp"></span>' +
    (opts.status ? '<span class="status" id="saveStatus"></span>' : '') +
    '<span class="who">' + esc(S.me ? S.me.name : '') + '</span>' +
    (S.me ? '<button data-act="logout">登出</button>' : '') + '</div>';
}
function setSaveStatus(t) {
  var e = document.getElementById('saveStatus');
  if (!e) return;
  e.textContent = { editing: '編輯中…', saving: '儲存中…', saved: '已自動儲存 ✓', error: '儲存失敗，稍後重試' }[t] || '';
}

/* 自動儲存 */
function makeSaver(getData, send, onSaved) {
  var timer = null, inflight = null, seq = 0, sentSeq = 0;
  var api_ = {
    touch: function () { seq++; setSaveStatus('editing'); clearTimeout(timer); timer = setTimeout(api_.flush, 1200); },
    flush: function () {
      clearTimeout(timer);
      var wait = inflight || Promise.resolve();
      return wait.then(function () {
        if (seq === sentSeq) return;
        var my = seq;
        setSaveStatus('saving');
        inflight = send(clone(getData())).then(function (r) {
          sentSeq = my;
          api_.warned = false;
          onSaved(r);
          setSaveStatus(seq === sentSeq ? 'saved' : 'editing');
          if (seq !== sentSeq) timer = setTimeout(api_.flush, 800);
        }).catch(function (e) {
          setSaveStatus('error');
          if (/送審|權限|只能|太長/.test(e.message || '')) { sentSeq = seq; fail(e); }
          else { // 網路或同時太多人儲存：自動重試
            if (!api_.warned) { toast('儲存暫時失敗，系統會自動重試，請先不要關掉頁面', 'err'); api_.warned = true; }
            clearTimeout(timer); timer = setTimeout(api_.flush, 5000);
          }
        }).then(function () { inflight = null; });
        return inflight;
      });
    },
    pending: function () { return seq !== sentSeq; }
  };
  return api_;
}
function leaveEditor() {
  var s = S.saver;
  S.saver = null;
  return s ? s.flush() : Promise.resolve();
}

/* 檔案 */
function fileData(fileId) {
  if (S.fileCache[fileId]) return Promise.resolve(S.fileCache[fileId]);
  return api('getFileData', S.code, fileId).then(function (d) { S.fileCache[fileId] = d; return d; });
}
function hydrateFiles(root) {
  (root || app).querySelectorAll('[data-file]').forEach(function (el) {
    var id = el.getAttribute('data-file');
    if (!id) return;
    fileData(id).then(function (d) { if (d.dataUrl) el.src = d.dataUrl; }).catch(function () { el.alt = '讀取失敗'; });
  });
}
function readAsDataURL(file) {
  return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsDataURL(file); });
}
function readAsText(file) {
  return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsText(file, 'UTF-8'); });
}
function compressImage(file, maxEdge, quality) {
  maxEdge = maxEdge || 1400; quality = quality || 0.82;
  return readAsDataURL(file).then(function (url) {
    return new Promise(function (res) {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, maxEdge / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * k); c.height = Math.round(h * k);
        var g = c.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = function () { res(url); };
      img.src = url;
    });
  });
}
function b64Of(dataUrl) { return dataUrl.substring(dataUrl.indexOf(',') + 1); }

/** 上傳一般檔案（圖片會先壓縮） */
function uploadMedia(file, kind, meta) {
  var p;
  if (kind === 'image' && /^image\/(jpeg|png|webp|heic|heif|bmp)$/i.test(file.type || 'image/jpeg') && !/gif|svg/i.test(file.type)) {
    p = compressImage(file).then(function (u) { return { b64: b64Of(u), mime: 'image/jpeg', name: (file.name || 'image').replace(/\.\w+$/, '') + '.jpg' }; });
  } else {
    if (file.size > 8 * 1024 * 1024) return Promise.reject(new Error('檔案超過 8 MB，請先壓縮'));
    p = readAsDataURL(file).then(function (u) { return { b64: b64Of(u), mime: file.type || 'application/octet-stream', name: file.name }; });
  }
  toast('上傳中…');
  return p.then(function (x) {
    return api('uploadFile', S.code, { roomId: meta.roomId, puzzleId: meta.puzzleId || '', label: meta.label || '', name: x.name, mime: x.mime }, x.b64, false);
  });
}

/** HTML 檔：找出引用的外部檔案，請使用者一起選取後嵌入成單一檔案 */
function externalRefs(html) {
  var refs = {}, m;
  var re1 = /(?:src|href)\s*=\s*["']([^"'#]+)["']/gi, re2 = /url\(\s*["']?([^"')]+)["']?\s*\)/gi;
  var skip = /^(https?:|data:|blob:|mailto:|javascript:|\/\/|#|tel:)/i;
  while ((m = re1.exec(html))) if (!skip.test(m[1].trim())) refs[m[1].trim()] = 1;
  while ((m = re2.exec(html))) if (!skip.test(m[1].trim())) refs[m[1].trim()] = 1;
  return Object.keys(refs);
}
function prepareHtml(file) {
  return readAsText(file).then(function (html) {
    var refs = externalRefs(html);
    if (!refs.length) return html;
    return new Promise(function (res) {
      var d = modal('<h3>這個 HTML 還需要其他檔案</h3><p class="help">檔案裡引用了下面這些檔案。請把它們一起選進來，系統會把它們嵌進 HTML，變成單一檔案。</p><ul>' +
        refs.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') +
        '</ul><input type="file" id="refFiles" multiple><div class="btns"><button class="btn" id="refOk">嵌入並上傳</button><button class="btn ghost" id="refSkip">略過，直接上傳</button></div>', function () { res(null); });
      d.querySelector('#refSkip').onclick = function () { S.onModalClose = null; closeModal(); res(html); };
      d.querySelector('#refOk').onclick = function () {
        var files = Array.prototype.slice.call(d.querySelector('#refFiles').files || []);
        Promise.all(files.map(function (f) { return readAsDataURL(f).then(function (u) { return { name: f.name, url: u }; }); })).then(function (list) {
          var out = html, missing = [];
          refs.forEach(function (r) {
            var base = r.split('/').pop().split('?')[0];
            var hit = list.filter(function (x) { return x.name === base; })[0];
            if (hit) out = out.split(r).join(hit.url); else missing.push(r);
          });
          S.onModalClose = null; closeModal();
          if (missing.length) toast('還缺：' + missing.join('、') + '，這些部分可能無法顯示', 'err');
          res(out);
        });
      };
    });
  });
}

function boot() {

function showLogin(msg) {

function doLogin(code, silent) {
  app.innerHTML = '<div class="login"><p class="muted">載入中…</p></div>';
  return api('login', code).then(function (me) {
    S.me = me; S.code = me.code;

function openPuzzle(id) {
  var p = (S.ws.puzzles || []).filter(function (x) { return x.id === id; })[0];
  var editable;
  if (S.ws.mode === 'admin') editable = true;
  else if (S.ws.mode === 'teacher') editable = !!p.editable;
  else editable = S.ws.editable;
  S.puzzle = clone(p);
  S.edit = { editable: editable, mode: S.ws.mode };
  S.target = 'puzzle';
  S.saver = editable ? makeSaver(function () { return S.puzzle; }, function (d) { return api('savePuzzle', S.code, d); }, function (r) {
    if (r.conflict) {
      toast('這題剛被別人改過，已載入最新版本', 'err');
      S.puzzle = r.puzzle; renderPuzzleEditor(); return;
    }
    S.puzzle.rev = r.puzzle.rev;
    S.puzzle.checks = r.puzzle.checks;

    if (pc) pc.innerHTML = checksHtml(S.puzzle.checks);
    var idx = S.ws.puzzles.map(function (x) { return x.id; }).indexOf(S.puzzle.id);

}

/* 玩家角度預覽（只在本機判斷答案，不會記錄） */
function previewPuzzle(p) {
  var gates = [];
  (p.steps || []).forEach(function (s) { if (String(s.checkpoint || '').trim()) gates.push({ label: s.result || '中途答案', answers: splitAns(s.checkpoint) }); });
  gates.push({ label: '答案', answers: splitAns(p.answer) });
  var g = 0;
  var d = modal('<div style="background:#12161b;color:#eef0f2;border-radius:12px;padding:6px 14px 14px;margin-top:22px"><div class="pcard" style="margin-top:12px"><h2>' + esc(p.title) + '</h2><div id="pvBlocks"></div></div>' +
    '<div class="pcard"><div class="gate" id="pvGate"></div><input class="pin" id="pvIn" autocomplete="off"><button class="pbtn" id="pvGo">送出</button><div class="pmsg" id="pvMsg"></div>' +
    (p.hints || []).filter(function (x) { return String(x.text || '').trim(); }).map(function (x, i) { return '<div class="phint">提示 ' + (i + 1) + '（開始後 ' + (x.delaySec || 0) + ' 秒）：' + esc(x.text) + '</div>'; }).join('') + '</div></div>');
  var setGate = function () { d.querySelector('#pvGate').textContent = gates.length > 1 ? '第 ' + (g + 1) + ' / ' + gates.length + ' 步：' + gates[g].label : '答案'; };
  setGate();
  renderPlayBlocks(d.querySelector('#pvBlocks'), (p.blocks || []).map(function (b) { return b; }), true);
  d.querySelector('#pvGo').onclick = function () {
    var v = d.querySelector('#pvIn').value, m = d.querySelector('#pvMsg');
    if (norm(v) && gates[g].answers.some(function (a) { return norm(a) === norm(v); })) {
      if (g < gates.length - 1) { g++; setGate(); m.className = 'pmsg good'; m.textContent = '正確！繼續下一步'; d.querySelector('#pvIn').value = ''; }
      else { m.className = 'pmsg good'; m.textContent = '答對了！這題完成'; }
    } else { m.className = 'pmsg bad'; m.textContent = '答案不對'; }
  };
}

function tickPlay() {
  var P = S.play;
  if (!P || S.view !== 'play') return;
  var left = Math.max(0, Math.ceil((P.deadline - Date.now()) / 1000));
  var tm = document.getElementById('tm');
  if (tm) { tm.textContent = fmtSec(left); tm.className = 'timer' + (left < 120 ? ' low' : ''); }
  if (left <= 0 && !P.timingOut) {
    P.timingOut = true;
    api('playState', P.id, P.pid).then(function (st) { P.timingOut = false; applyPlayState(st); }).catch(function () { P.timingOut = false; });
    return;
  }
  var hb = document.getElementById('hintBtn');
  if (hb) {
    var w = P.hintAt < 0 ? -1 : Math.ceil((P.hintAt - Date.now()) / 1000);
    var n = P.state.hintsShown.length + 1;
    hb.disabled = w > 0;
    hb.textContent = w > 0 ? '提示 ' + n + '（' + w + ' 秒後可看）' : '看提示 ' + n;
  }
  var gb = document.getElementById('goBtn');
  if (gb) {
    var c = Math.ceil((P.coolAt - Date.now()) / 1000);
    gb.disabled = c > 0 || P.busy;
    gb.textContent = c > 0 ? '請等 ' + c + ' 秒' : '送出';
  }
}
function sendAnswer() {
  var P = S.play, inp = document.getElementById('ans');
  if (!inp || P.busy) return;
  var v = inp.value;
  if (!v.trim()) { var m = document.getElementById('pmsg'); m.className = 'pmsg bad'; m.textContent = '請先輸入答案'; return; }
  if (Date.now() < P.coolAt) return;
  P.busy = true; tickPlay();
  api('playAnswer', P.id, v).then(function (r) {
    P.busy = false;
    var st = r.state;
    if (r.solved) {
      var won = r.escaped || (r.escaped === undefined && st.result === 'escaped');
      flash(won ? '逃脫成功！' : r.fragment ? '解開了！拿到碎片「' + r.fragment + '」' : '解開了！', function () { applyPlayState(st); });
      return;
    }
    P.state = st;
    P.deadline = Date.now() + st.remainingSec * 1000;
    P.hintAt = st.nextHintInSec >= 0 ? Date.now() + st.nextHintInSec * 1000 : -1;
    P.coolAt = Date.now() + (st.cooldownSec || 0) * 1000;
    if (isOver(st)) return showEnding(st);
    if (r.gatePassed) return renderPlay('正確！繼續下一步', true);
    if (r.wait) return renderPlay('請稍等再作答');
    renderPlay('答案不對，再想想');
  }).catch(function (e) { P.busy = false; fail(e); });
}
function flash(text, then) {
  var f = document.createElement('div');
  f.className = 'flash'; f.textContent = text;
  document.body.appendChild(f);
  setTimeout(function () { f.remove(); then(); }, 1100);
}
function askSkip() {
  var P = S.play, st = P.state;
  var go = function () {
    api('playSkip', P.id).then(function (r) {
      if (r.escaped) return flash('逃脫成功！', function () { applyPlayState(r.state); });
      if (r.fragment) return flash('跳過了，拿到碎片「' + r.fragment + '」', function () { applyPlayState(r.state); });
      applyPlayState(r.state);
    }).catch(fail);
  };
  if (st.phase === 'vault') return go();
  confirmBox('跳過這一題會扣 ' + st.skipMin + ' 分鐘' + (st.finale ? '，但照樣拿到這一題的碎片' : '') + '。確定要跳過嗎？', '跳過').then(function (ok) { if (ok) go(); });
}
function finishVault() {
  confirmBox('結束遊戲？寶庫剩下的題目就不玩了，逃脫時間不受影響。', '結束').then(function (ok) {
    if (ok) api('playFinish', S.play.id).then(function (r) { applyPlayState(r.state); }).catch(fail);
  });
}
function askHint() {
  var P = S.play;
  api('playHint', P.id).then(function (r) { applyPlayState(r.state); }).catch(fail);
}
function showEnding(st) {
  clearTimers();
  var P = S.play;
  S.view = 'playEnd';
  var e = st.ending || {};
  var h = '<div class="play"><div class="pcard"><h2>' + (st.result === 'escaped' ? '逃脫成功！' : '時間到') + '</h2>' + (e.image ? '<img src="' + e.image + '">' : '') + '<div class="txt">' + esc(e.text) + '</div>' +
    '<p style="color:#aab3bd">用時 ' + fmtSec(st.elapsedSec) + (st.penaltySec ? '（含跳過扣時 ' + Math.round(st.penaltySec / 60) + ' 分鐘）' : '') +
    (st.vaultTotal && st.result === 'escaped' ? '　寶庫寶物 ' + st.vaultSolved + ' / ' + st.vaultTotal + ' 件' : '') + '</p></div>';
  h += '<div class="pcard"><h2>幫每一題評難易度</h2><p style="color:#aab3bd">1 顆星最容易，5 顆星最難。</p>' + (st.rateList || []).map(function (q) {
    return '<div style="margin:10px 0"><div>' + esc(q.label || '第 ' + q.no + ' 題') + '　' + esc(q.title) + '</div><div class="stars">' + [1, 2, 3, 4, 5].map(function (v) {
      return '<button data-act="star" data-pid="' + esc(q.id) + '" data-v="' + v + '" aria-label="' + v + ' 顆星">★</button>';
    }).join('') + '</div></div>';
  }).join('') +
    '<label style="display:block;margin-top:12px">最喜歡哪一題？為什麼？</label><textarea id="liked" style="width:100%;min-height:70px;border-radius:10px;padding:10px"></textarea>' +
    '<label style="display:block;margin-top:12px">最卡在哪裡？有沒有覺得不公平的地方？</label><textarea id="stuck" style="width:100%;min-height:70px;border-radius:10px;padding:10px"></textarea>' +
    '<button class="pbtn" data-act="sendRate">送出回饋</button></div></div>';
  app.innerHTML = h;
}
function finishRate() {
  var P = S.play;
  var list = Object.keys(P.rate).map(function (k) { return { id: k, rating: P.rate[k] }; });
  api('playRate', P.id, list, document.getElementById('liked').value, document.getElementById('stuck').value).then(function () {
    app.innerHTML = '<div class="play"><div class="pcard center"><h2>謝謝你的回饋！</h2>' +
      (P.test && S.code ? '<button class="pbtn" data-act="backFromTest">回到編輯</button>' : '<p>可以把平板交給下一隊了。</p><button class="pbtn ghost" data-act="toLogin">回到首頁</button>') + '</div></div>';
  }).catch(fail);
}

app.addEventListener('input', function (e) {
  var t = e.target, f = t.getAttribute('data-f');
  if (t.hasAttribute('data-asmfrag') && S.assemble) {
    S.assemble.frags[Number(t.getAttribute('data-asmfrag'))] = t.value;
    var j = document.getElementById('asmJoined');
    if (j) j.textContent = S.assemble.frags.join('');
    return;
  }
  if (!f || !S.saver) return;
  var obj = S.target === 'room' ? S.room : S.puzzle;
  var v = t.value;
  if (t.getAttribute('data-num')) v = v === '' ? '' : Number(v);
  setPath(obj, f, v);
  S.saver.touch();
});
app.addEventListener('change', function (e) {
  var t = e.target;
  if (t.getAttribute('data-check') && S.saver) {
    setPath(S.target === 'room' ? S.room : S.puzzle, t.getAttribute('data-check'), t.checked);
    S.saver.touch();
    if (S.target === 'room') renderRoomEditor();
    return;
  }
  if (t.tagName === 'SELECT' && t.getAttribute('data-f') && S.saver) {
    setPath(S.target === 'room' ? S.room : S.puzzle, t.getAttribute('data-f'), t.value);
    S.saver.touch();
    return;
  }
  var up = t.getAttribute('data-upload');
  if (!up || !t.files || !t.files[0]) return;
  var file = t.files[0];
  if (up === 'block' || up === 'html') {
    var i = Number(t.getAttribute('data-i')), b = S.puzzle.blocks[i];
    var meta = { roomId: S.puzzle.roomId, puzzleId: S.puzzle.id, label: BLOCK_TYPES[b.type] };
    var job = up === 'html'
      ? prepareHtml(file).then(function (html) {
          if (html === null) return null;
          toast('上傳中…');
          return api('uploadFile', S.code, { roomId: S.puzzle.roomId, puzzleId: S.puzzle.id, label: 'HTML', name: file.name, mime: 'text/html' }, html, true)
            .then(function (r) { S.fileCache[r.fileId] = { mime: 'text/html', text: html }; r.fileName = file.name; return r; });
        })
      : uploadMedia(file, b.type, meta);
    job.then(function (r) {
      if (!r) return;
      b.fileId = r.fileId;
      if (r.fileName) b.fileName = r.fileName;
      toast('上傳完成');
      S.saver.touch();
      renderPuzzleEditor();
    }).catch(fail);
  }
  if (up === 'roomimg' || up === 'mindmap') {
    var path = up === 'mindmap' ? 'mindmap.fileId' : t.getAttribute('data-path');
    uploadMedia(file, /pdf/.test(file.type) ? 'file' : 'image', { roomId: S.room.id, label: up === 'mindmap' ? '心智圖' : t.getAttribute('data-label') }).then(function (r) {
      setPath(S.room, path, r.fileId);
      toast('上傳完成');
      S.saver.touch();
      renderRoomEditor();
    }).catch(fail);
  }
});
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  if (el.tagName === 'A') e.preventDefault();
  var A = ACTIONS[act];
  if (A) A(el, id);
});

    api('adminCreateTeachers', S.code, names).then(function (r) { toast('已建立 ' + r.length + ' 位'); showAdmin('codes'); }).catch(fail);
  },
  printCodes: function () { printCodes(); },
  saveSettings: function () {
    var data = {};
    document.querySelectorAll('[data-set]').forEach(function (i) { data[i.getAttribute('data-set')] = i.type === 'checkbox' ? i.checked : i.value; });
    api('adminSaveSettings', S.code, data).then(function (s) { S.me.settings = s; S.admin.data.settings = s; toast('已儲存設定'); }).catch(fail);
  }
};
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'code') ACTIONS.login();
  if (e.key === 'Enter' && e.target.id === 'pcode') ACTIONS.toPlay();
});
boot();
</script>
</body>
</html>
