<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>密室島｜黃金城歷險 Adventure!</title>
<!-- 密室島：學生密室的公開展示頁。改這個檔，再執行 node tools/build-pages.js 產生 docs/islands.html -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b2533;color:#eef3f5;font-family:'Noto Sans TC',system-ui,sans-serif}
.page{min-height:100vh;padding:32px clamp(16px,4vw,48px) 40px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.kicker{margin:0;font-size:14px;letter-spacing:.12em;color:#b9cdd6}
h1{margin:6px 0;font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(36px,5vw,60px);line-height:1.1;color:#f3d27e}
.lead{margin:0;font-size:16px;color:#cfdde3}
.pill-btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #4d7486;background:transparent;color:#eef3f5;font:inherit;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:8px}
.pill-btn:hover{border-color:#e8b84a}
.pill-btn[hidden]{display:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:#133243;border-radius:14px;padding:14px 16px}
.stat p{margin:0;font-size:13px;color:#b9cdd6}
.stat b{display:block;margin-top:2px;font-size:28px;color:#f3d27e}
.stat b small{font-size:15px;color:#cfdde3;font-weight:400}
.main{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.scene{flex:999 1 600px;min-width:0;position:relative;aspect-ratio:16/10;border-radius:22px;overflow:hidden;background:#081c27;perspective:1400px;box-shadow:inset 0 0 0 1px #24546a}
@keyframes drift{from{background-position:0 0}to{background-position:240px 0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ripple{0%{transform:translateX(-50%) scale(.85);opacity:.7}100%{transform:translateX(-50%) scale(1.15);opacity:0}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
.plane{position:absolute;left:-40%;right:-40%;top:-60%;bottom:-4%;transform-origin:50% 72%;transform-style:preserve-3d;transform:rotateX(40deg);background-color:#12384a;
  background-image:radial-gradient(circle at 50% 0,transparent 17px,rgba(255,255,255,.09) 18px,transparent 20px);background-size:60px 28px;animation:drift 40s linear infinite}
.spot{position:absolute;left:50%;bottom:5%;width:30%;height:26%;transform:translateX(-50%);border-radius:50%;background:rgba(232,184,74,.2);box-shadow:0 0 80px 30px rgba(232,184,74,.18);animation:glow 3s ease-in-out infinite}
.isle{position:absolute;padding:0;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  transform-origin:50% 100%;transform:rotateX(-40deg);
  transition:left .9s cubic-bezier(.2,.8,.2,1),bottom .9s cubic-bezier(.2,.8,.2,1),width .9s cubic-bezier(.2,.8,.2,1),opacity .9s}
.isle:focus-visible{outline:3px solid #e8b84a;outline-offset:4px;border-radius:14px}
.isle-name{font-family:'Noto Serif TC',serif;font-weight:600;font-size:clamp(11px,1vw,14px);background:rgba(11,37,51,.85);color:#eef3f5;padding:3px 12px;border-radius:999px;white-space:nowrap;transition:font-size .6s,color .6s}
.isle-group{font-size:clamp(10px,.85vw,12px);color:#cfdde3;white-space:nowrap;transition:font-size .6s}
.isle.on .isle-name{font-weight:900;font-size:clamp(18px,2.2vw,30px);color:#f3d27e}
.isle.on .isle-group{font-size:clamp(13px,1.2vw,16px)}
.isle:hover .isle-name{background:#e8b84a;color:#1d2b33}
.isle:hover svg{filter:brightness(1.1)}
.body{position:relative;display:block;width:100%;aspect-ratio:200/120}
.bob{position:absolute;inset:0;display:block;animation:bob 6s ease-in-out infinite}
.bob svg{width:100%;height:100%;display:block;overflow:visible;transition:filter .2s}
.ripple{position:absolute;left:50%;bottom:-6%;width:92%;height:18%;border:2px solid rgba(220,240,248,.55);border-radius:50%;animation:ripple 2.8s ease-out infinite}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:1px solid #e8b84a;background:rgba(8,28,39,.75);color:#f3d27e;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:200}
.arrow.l{left:16px}.arrow.r{right:16px}
.dots{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;pointer-events:none;z-index:200}
.dots .count{font-size:13px;letter-spacing:.2em;color:#e8b84a;margin-right:6px;white-space:nowrap}
.dots i{display:block;width:8px;height:8px;border-radius:4px;background:rgba(238,243,245,.4);transition:width .4s}
.dots i.on{width:28px;background:#e8b84a}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:17px;color:#cfdde3;z-index:300}
.panel{flex:1 1 340px;min-width:0;background:#f7f3ea;color:#1d2b33;border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:16px}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:13px;font-weight:700;color:#6b5320;background:#efe2c2;padding:4px 12px;border-radius:999px}
.nav{display:flex;gap:6px}
.nav button{width:44px;height:44px;border-radius:50%;border:1px solid #cdbf9c;background:#fff;color:#1d2b33;cursor:pointer;display:flex;align-items:center;justify-content:center}
.panel h2{margin:0;font-family:'Noto Serif TC',serif;font-weight:900;font-size:30px;line-height:1.25}
.panel .grp{margin:4px 0 0;font-size:16px;color:#4a5a63}
.story{margin:0;font-size:16px;line-height:1.7;color:#33434c;border-top:1px dashed #cdbf9c;padding-top:14px;white-space:pre-line}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.nums div{background:#efe2c2;border-radius:12px;padding:10px 4px}
.nums p{margin:0;font-size:12px;color:#6b5320}
.nums b{display:block;margin-top:2px;font-size:20px}
.panel h3{margin:0 0 4px;font-size:15px;letter-spacing:.1em;color:#6b5320}
.panel ol{margin:0;padding:0;list-style:none}
.panel li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid #e4d9bf;font-size:15px}
.panel li .no{color:#8a6a2a;margin-right:8px}
.who{font-family:'Noto Serif TC',serif;font-weight:600;white-space:nowrap}
.note{margin:4px 0 0;font-size:14px;color:#6b5320}
.go{min-height:48px;border-radius:14px;background:#1d2b33;color:#f3d27e;text-decoration:none;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.go:hover{background:#2a3d48}
.foot{margin:0;font-size:13px;color:#8fa9b5}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.arrow{width:44px;height:44px}.scene{aspect-ratio:1/1}}
@media (prefers-reduced-motion:reduce){.plane,.bob,.ripple,.spot{animation:none}.isle{transition:none}}
</style>
</head>
<body>
<div class="page"><div class="wrap">
  <div class="head">
    <div>
      <p class="kicker">金門縣立金城國中 ｜ 區域資優方案「黃金城歷險 Adventure!」</p>
      <h1>密室島</h1>
      <p class="lead">氣候變遷密室設計成果——每一座島，都是一組學生親手打造的密室</p>
    </div>
    <button type="button" class="pill-btn" id="namesBtn" aria-pressed="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>顯示設計者名字</span>
    </button>
  </div>

  <div class="stats">
    <div class="stat"><p>密室島</p><b id="sRooms">–</b></div>
    <div class="stat"><p>學生設計的謎題</p><b id="sPuzzles">–</b></div>
    <div class="stat"><p>挑戰隊伍</p><b id="sPlays">–</b></div>
    <div class="stat"><p>成功逃脫</p><b id="sWins">–</b></div>
  </div>

  <div class="main">
    <div class="scene" id="scene">
      <div class="plane" id="plane"><span class="spot" aria-hidden="true"></span></div>
      <div class="msg" id="msg">正在把島嶼浮上海面…</div>
    </div>
    <aside class="panel" id="panel" hidden></aside>
  </div>

  <p class="foot">只收錄已發布的學生密室；挑戰數據不含試玩，約每 5 分鐘更新一次。</p>
</div></div>

<script>
(function () {
  var API = window.ER_API;
  var S = { rooms: [], sel: 0, names: true, pub: true }; // pub：後端有沒有送出名字（設定關掉就完全沒有）
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var LANDS = ['#6fa35a', '#8fb6a8', '#9aae5c', '#5f9a6e', '#79a84f', '#6a9f63', '#83a05a', '#5d9480'];
  var ICON_L = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
  var ICON_R = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

  /* 每座島的外形由 id 決定：同一座島每次打開長得一樣 */
  function seedOf(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function islandSvg(room, i) {
    var r = rng(seedOf(room.id || String(i)));
    var cx = 100, cy = 58, RX = 84, RY = 32, n = 10, pts = [], k;
    var f = function (v) { return v.toFixed(1); };
    for (k = 0; k < n; k++) {
      var a = (k / n) * Math.PI * 2, s = 0.82 + r() * 0.3;
      pts.push([cx + Math.cos(a) * RX * s, cy + Math.sin(a) * RY * s]);
    }
    var mid = function (p, q) { return [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; };
    var m0 = mid(pts[n - 1], pts[0]);
    var d = 'M' + f(m0[0]) + ' ' + f(m0[1]);
    for (k = 0; k < n; k++) { var p = pts[k], mm = mid(p, pts[(k + 1) % n]); d += ' Q' + f(p[0]) + ' ' + f(p[1]) + ' ' + f(mm[0]) + ' ' + f(mm[1]); }
    d += ' Z';
    var spots = [];
    for (k = 0; k < 6; k++) { var b = r() * Math.PI * 2, rr = 0.3 + r() * 0.25; spots.push([cx + Math.cos(b) * RX * rr, cy + Math.sin(b) * RY * rr]); }
    spots.sort(function (x, y) { return x[1] - y[1]; });
    var trees = spots.map(function (q) { return 'M' + f(q[0]) + ' ' + f(q[1] - 16) + ' l7 16 l-14 0 z'; }).join(' ');
    var np = Math.max(1, room.puzzles.length), marks = '';
    for (k = 0; k < np; k++) {
      var c = (k / np) * Math.PI * 2 + r() * 0.6, r2 = 0.2 + r() * 0.25;
      var x = cx + Math.cos(c) * RX * r2, y = cy + Math.sin(c) * RY * r2;
      marks += 'M' + f(x - 6) + ' ' + f(y) + ' a6 4 0 1 0 12 0 a6 4 0 1 0 -12 0 ';
    }
    var land = LANDS[i % LANDS.length];
    return '<svg viewBox="0 0 200 120" aria-hidden="true">' +
      '<path d="' + d + '" fill="#5a4330" transform="translate(0 24)"/>' +
      '<path d="' + d + '" fill="#6b5039" transform="translate(0 16)"/>' +
      '<path d="' + d + '" fill="#7d5f43" transform="translate(0 8)"/>' +
      '<path class="ring" d="' + d + '" fill="#e9d7a6" stroke="none" stroke-width="5" stroke-dasharray="10 6"/>' +
      '<path d="' + d + '" fill="' + land + '" transform="translate(100 58) scale(0.8) translate(-100 -58)"/>' +
      '<path d="' + trees + '" fill="#2c5f37"/>' +
      '<path d="' + marks + '" fill="#e8b84a" stroke="#5a3d0a" stroke-width="1.5"/></svg>';
  }

  /* 選角式排列：選到的島轉到正前方，其他島沿著一圈往後退 */
  function place() {
    var n = S.rooms.length;
    var narrow = $('scene').clientWidth < 600; // 手機：島放大、圈收窄
    var k = 120 / 180; // 寬度與位置都以海面（比畫面寬）為準
    var frontW = k * (narrow ? 52 : (n <= 6 ? 30 : 26)), backW = k * (narrow ? 20 : (n <= 6 ? 13 : 10)), RX = k * (narrow ? 30 : 36);
    document.querySelectorAll('.isle').forEach(function (el, i) {
      var d = (((i - S.sel) % n) + n) % n;
      if (d > n / 2) d -= n;
      var a = n > 1 ? (d / n) * Math.PI * 2 : 0;
      var front = (Math.cos(a) + 1) / 2;
      var w = backW + (frontW - backW) * front;
      el.style.width = w.toFixed(2) + '%';
      el.style.left = (50 + Math.sin(a) * RX - w / 2).toFixed(2) + '%';
      el.style.bottom = (12 + (1 - front) * 30).toFixed(2) + '%';
      el.style.opacity = (0.4 + 0.6 * front).toFixed(2);
      el.style.zIndex = Math.round(front * 100);
      var on = i === S.sel;
      el.classList.toggle('on', on);
      el.setAttribute('aria-pressed', on ? 'true' : 'false');
      el.querySelector('.ring').setAttribute('stroke', on ? '#e8b84a' : 'none');
      el.querySelector('.isle-group').style.visibility = on ? 'visible' : 'hidden';
    });
    document.querySelectorAll('.dots i').forEach(function (el, i) { el.classList.toggle('on', i === S.sel); });
    var c = $('count'); if (c) c.textContent = 'ISLAND ' + (S.sel + 1) + ' / ' + n;
  }

  function mmss(sec) { if (!sec) return '—'; var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }

  function renderPanel() {
    var R = S.rooms[S.sel], pn = $('panel');
    var rate = R.plays ? Math.round(R.escaped / R.plays * 100) + '%' : '—';
    var list = R.puzzles.map(function (p, j) {
      return '<li><span><span class="no">第 ' + (j + 1) + ' 關</span>' + esc(p.title) + '</span>' +
        (S.names && p.author ? '<span class="who">' + esc(p.author) + '</span>' : '') + '</li>';
    }).join('');
    pn.innerHTML =
      '<div class="ptop"><span class="tag">' + esc(R.theme) + '地圖 ・ ' + R.puzzles.length + ' 道謎題</span>' +
      '<div class="nav"><button type="button" data-go="-1" aria-label="上一座島">' + ICON_L + '</button><button type="button" data-go="1" aria-label="下一座島">' + ICON_R + '</button></div></div>' +
      '<div><h2>' + esc(R.title) + '</h2>' + (R.group ? '<p class="grp">' + esc(R.group) + '</p>' : '') + '</div>' +
      (R.story ? '<p class="story">' + esc(R.story) + '</p>' : '') +
      '<div class="nums"><div><p>挑戰隊伍</p><b>' + R.plays + '</b></div><div><p>逃脫成功率</p><b>' + rate + '</b></div><div><p>最快紀錄</p><b>' + mmss(R.bestSec) + '</b></div></div>' +
      '<div><h3>' + (S.pub ? '關卡與設計者' : '關卡') + '</h3><ol>' + list + '</ol>' +
      (!S.pub ? '' : S.names ? (R.members.length ? '<p class="note">組員：' + R.members.map(esc).join('、') + '</p>' : '')
               : '<p class="note">目前只顯示組名，設計者名字已隱藏</p>') + '</div>' +
      (R.playCode ? '<a class="go" href="./?p=' + encodeURIComponent(R.playCode) + '">登島挑戰這間密室' + ICON_R.replace(/22/g, '18') + '</a>' : '');
    pn.hidden = false;
  }

  function go(i) {
    var n = S.rooms.length; if (!n) return;
    S.sel = ((i % n) + n) % n;
    place(); renderPanel();
  }

  function build() {
    var plane = $('plane'), scene = $('scene');
    var html = '<span class="spot" aria-hidden="true"></span>';
    S.rooms.forEach(function (R, i) {
      html += '<button type="button" class="isle" data-i="' + i + '" aria-label="' + esc(R.title + (R.group ? '，' + R.group : '')) + '">' +
        '<span class="isle-name">' + esc(R.title) + '</span><span class="isle-group">' + esc(R.group) + '</span>' +
        '<span class="body"><span class="bob" style="animation-delay:-' + (i * 1.1).toFixed(1) + 's">' + islandSvg(R, i) + '</span>' +
        '<span class="ripple" style="animation-delay:-' + (i * 1.1).toFixed(1) + 's"></span></span></button>';
    });
    plane.innerHTML = html;
    if (S.rooms.length > 1) {
      scene.insertAdjacentHTML('beforeend',
        '<button type="button" class="arrow l" data-go="-1" aria-label="上一座島">' + ICON_L + '</button>' +
        '<button type="button" class="arrow r" data-go="1" aria-label="下一座島">' + ICON_R + '</button>' +
        '<div class="dots"><span class="count" id="count"></span>' + S.rooms.map(function () { return '<i></i>'; }).join('') + '</div>');
    }
    $('msg').remove();
    go(0);
  }

  function stats() {
    var sum = function (k) { return S.rooms.reduce(function (t, r) { return t + (typeof k === 'function' ? k(r) : r[k]); }, 0); };
    $('sRooms').innerHTML = S.rooms.length + ' <small>座</small>';
    $('sPuzzles').innerHTML = sum(function (r) { return r.puzzles.length; }) + ' <small>道</small>';
    $('sPlays').innerHTML = sum('plays') + ' <small>隊次</small>';
    $('sWins').innerHTML = sum('escaped') + ' <small>隊次</small>';
  }

  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]');
    if (g) return go(S.sel + Number(g.getAttribute('data-go')));
    var isle = e.target.closest('.isle');
    if (isle) return go(Number(isle.getAttribute('data-i')));
  });
  window.addEventListener('resize', function () { if (S.rooms.length) place(); });
  document.addEventListener('keydown', function (e) {
    if (!S.rooms.length || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'ArrowLeft') go(S.sel - 1);
    if (e.key === 'ArrowRight') go(S.sel + 1);
  });
  $('namesBtn').addEventListener('click', function () {
    S.names = !S.names;
    this.setAttribute('aria-pressed', S.names ? 'true' : 'false');
    this.querySelector('span').textContent = S.names ? '顯示設計者名字' : '只顯示組名';
    if (S.rooms.length) renderPanel();
  });

  function fail(text) { $('msg').textContent = text; }
  if (!API) return fail('這一頁要從 GitHub Pages 打開（docs/islands.html）。');
  fetch(API, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'islandRooms', args: [] }) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) throw new Error(j.error);
      S.rooms = (j.result && j.result.rooms) || [];
      S.pub = !j.result || j.result.names !== false; // 舊版後端沒有這個欄位，當作有送
      if (!S.pub) { S.names = false; $('namesBtn').hidden = true; }
      stats();
      if (!S.rooms.length) return fail('島嶼還在海底醞釀中：等學生的密室審核發布後，就會一座座浮上來。');
      build();
    })
    .catch(function () { fail('連不上密室工坊，請檢查網路後重新整理。'); });
})();
</script>
</body>
</html>
